<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usi-Pro Chiffrage — Revue technique</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/usipro.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    /**
     * La revue se fait sur fond sombre.
     *
     * Un plan se lit sur papier clair, et un écran clair tout autour lui vole
     * son contraste : à côté d'une feuille blanche, un panneau blanc devient
     * du bruit. Le fond sombre rend la feuille au plan et laisse les chiffres
     * ressortir. Les jetons sont redéfinis ici seulement — les autres écrans
     * gardent le thème clair de `usipro.css`.
     */
    :root {
      --bg: #0A1211;
      --surface: #101A18;
      --surface-2: #16211F;
      --surface-3: #1C2A27;
      --paper: #FAFAF6;

      --ink: #E9F0ED;
      --ink-2: #9BADA8;
      --ink-3: #6E807B;

      --line: rgba(255,255,255,.075);
      --line-2: rgba(255,255,255,.15);

      /* Sur fond sombre, le teal et les verts du thème clair s'éteignent :
         il faut monter la luminance pour qu'ils restent des signaux. */
      --teal: #2FD8B9;
      --teal-ink: #05312B;
      --teal-soft: rgba(47,216,185,.13);
      --green: #43BE6D;
      --green-soft: rgba(67,190,109,.13);
      --amber: #E2A93C;
      --amber-soft: rgba(226,169,60,.13);
      --red: #E2604F;
      --red-soft: rgba(226,96,79,.13);
    }

    body { background: var(--bg); color: var(--ink); overflow: hidden; }

    /* ── Barre d'application ── */
    .app-bar { background: var(--surface); border-bottom-color: var(--line); gap: 16px; }
    /* Le logo est dessiné pour fond sombre : ici son socle se fond dans la
       barre au lieu de faire une pastille claire. */
    .brand { background: #05100E; }
    a.brand:hover { background: #020806; }
    .app-nav { color: var(--ink-3); }
    .app-nav:hover { color: var(--ink); }
    .app-nav[aria-current="page"] { color: var(--ink); border-bottom-color: var(--teal); }

    /* Le devis en cours : un menu, là où il y avait une colonne entière. */
    .picker {
      font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink);
      background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px;
      padding: 9px 30px 9px 12px; width: auto; max-width: 330px; cursor: pointer;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%),
                        linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
      background-position: calc(100% - 15px) 18px, calc(100% - 11px) 18px;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
    }
    .picker:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }

    /* L'avancement du devis ouvert, à droite : combien il en reste. */
    .load { display: flex; align-items: center; gap: 14px; }
    .load-n { text-align: right; line-height: 1; }
    .load-n .n { font-family: var(--mono); font-size: 25px; font-weight: 600; }
    .load-n .l { font-size: 10.5px; color: var(--ink-3); margin-top: 4px; }
    .load-bar { display: flex; flex-direction: column; gap: 6px; }
    .load-bar .track { width: 120px; height: 4px; border-radius: 2px; background: var(--surface-3); }
    .load-bar .fill { display: block; height: 100%; border-radius: 2px; background: var(--teal); }
    .load-bar .c { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }

    /* ── Deux colonnes : le plan, la proposition ── */
    .workbench {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 484px;
      height: calc(100vh - 56px);
    }

    /* Colonne 1 — le plan */
    .plan { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
    .plan-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 18px; border-bottom: 1px solid var(--line);
      font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
    }
    .plan-bar .badge {
      background: var(--surface-2); border: 1px solid var(--line);
      color: var(--ink-2); border-radius: 5px; padding: 3px 8px; font-size: 10.5px;
    }
    .plan-bar .badge.warn { color: #E8C078; border-color: rgba(226,169,60,.3); }
    .plan-bar .badge.bad { color: #E8887A; border-color: rgba(226,96,79,.3); }
    .plan-bar .pos { margin-left: auto; color: var(--ink-2); }
    .plan-bar .step {
      background: var(--surface-2); border: 1px solid var(--line-2); color: var(--ink);
      border-radius: 6px; width: 26px; height: 24px; cursor: pointer; font-size: 12px;
    }
    .plan-bar .step:disabled { opacity: .35; cursor: not-allowed; }

    .plan-body {
      flex-grow: 1; min-height: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      padding: 18px; text-align: center;
      color: var(--ink-3); font-size: 12.5px; line-height: 1.6;
      overflow-y: auto;
    }
    .plan-sheet {
      background: var(--paper); color: #15201E;
      width: min(620px, 100%); aspect-ratio: 1.414;
      flex-shrink: 0; border-radius: 4px; padding: 20px;
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 24px 50px -24px #000;
      text-align: left;
    }
    /* Un plan réel prend toute la hauteur offerte : le format A4 fixe n'est
       qu'un cadre d'attente, il ne doit pas rétrécir une cote à lire. */
    .plan-sheet.has-plan { aspect-ratio: auto; width: min(880px, 100%); flex: 1 1 auto; min-height: 200px; }
    .plan-sheet .title { font-family: var(--mono); font-size: 11.5px; font-weight: 600; }
    .plan-sheet .frame {
      flex-grow: 1; min-height: 0;
      border: 1px solid #C9CCC4; border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      color: #6D746C; font-size: 12px; text-align: center; line-height: 1.6;
      overflow: hidden; background: #fff;
    }
    .plan-sheet .frame > span { padding: 16px; }
    .plan-sheet .frame canvas, .plan-sheet .frame img { max-width: 100%; max-height: 100%; display: block; }
    .plan-sheet .cartouche {
      border: 1px solid #C9CCC4; border-radius: 2px; padding: 7px 9px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      font-family: var(--mono); font-size: 10px; color: #4A524C;
    }
    .plan-sheet .cartouche .dim { color: #8A918A; }

    /* Les documents reçus, sous la feuille. */
    .docs { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; justify-content: center; }
    .doc-chip {
      font-family: var(--mono); font-size: 10.5px;
      background: var(--surface); color: var(--ink-3);
      border: 1px solid var(--line); border-radius: 6px;
      padding: 5px 9px; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .doc-chip:hover { border-color: var(--line-2); color: var(--ink); }
    .doc-chip[aria-current="true"] { background: var(--teal-soft); border-color: var(--teal); color: var(--ink); }
    .doc-chip:disabled { opacity: .35; cursor: not-allowed; }
    .doc-note { font-size: 11.5px; color: var(--ink-3); max-width: 62ch; }
    .doc-note.uncertain { color: #E8C078; }

    /**
     * La barre d'articles : elle remplace le rail de gauche.
     *
     * Sur une seule ligne, qui défile : une demande peut porter cinquante-sept
     * articles, et les laisser passer à la ligne mangerait la moitié de la
     * hauteur du plan. L'article en revue est ramené dans la vue à chaque
     * changement.
     */
    .articles {
      display: flex; align-items: center; gap: 7px; flex-wrap: nowrap;
      padding: 10px 18px; border-top: 1px solid var(--line); flex-shrink: 0;
      overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent;
    }
    .art {
      display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0;
      padding: 6px 11px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 7px; cursor: pointer;
      font-family: var(--sans); font-size: 12px; color: var(--ink-2);
    }
    .art:hover { border-color: var(--line-2); color: var(--ink); }
    .art[aria-current="true"] { background: var(--teal-soft); border-color: var(--teal); color: var(--ink); }
    .art .st { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .art .ref { font-family: var(--mono); font-size: 11.5px; }

    /* ── Colonne 2 — la proposition ──
     *
     * Elle ne défile jamais : elle est un conteneur, et se resserre par
     * paliers quand la fenêtre rétrécit (voir plus bas). La seule zone de
     * longueur imprévisible — les constats — est la seule qui s'ajuste.
     */
    .proposal {
      background: var(--surface); border-left: 1px solid var(--line);
      display: flex; flex-direction: column; min-height: 0;
      container-type: size; container-name: prop;
    }
    .eyebrow { color: var(--ink-3); }

    /* Deux vues, un seul verdict. Les onglets ne déplacent jamais les boutons
       Valider et Rejeter : ils restent au même pixel dans les deux vues. */
    .prop-tabs { display: flex; gap: 2px; padding: 0 22px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .prop-tabs button {
      font-family: var(--sans); font-size: 12.5px; font-weight: 600; color: var(--ink-3);
      background: none; border: 0; border-bottom: 2px solid transparent;
      padding: 12px 10px; cursor: pointer;
    }
    .prop-tabs button:hover { color: var(--ink); }
    .prop-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--teal); }
    .prop-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    /* La méthode est longue par nature : c'est la seule vue qui défile. */
    .prop-view.methode {
      overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent;
    }

    /* Le récit : des chiffres pointables dans une phrase qui se lit. */
    .method { padding: 15px 22px 20px; display: flex; flex-direction: column; gap: 15px; }
    .method .para, .method .gamme { display: flex; flex-direction: column; gap: 6px; }
    .method p { font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }
    .method .n { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
    .method .from {
      font-size: 11px; line-height: 1.45; color: var(--ink-3);
      border-left: 2px solid var(--surface-3); padding-left: 10px;
    }
    .method .gamme .k { display: flex; align-items: baseline; gap: 10px; }
    .method .gamme strong { font-size: 15px; color: var(--ink); }
    .method p.warn { color: var(--amber); }
    .method p.bad { color: var(--red); }
    .method .suppose { margin: 0; padding-left: 17px; display: flex; flex-direction: column; gap: 5px; }
    .method .suppose li { font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
    .method a { color: var(--teal); }

    .prop-head { padding: 16px 22px 13px; flex-shrink: 0; }
    .price-row { display: flex; align-items: flex-end; gap: 12px; margin-top: 9px; }
    .price-big { font-family: var(--mono); font-size: 35px; font-weight: 600; line-height: .95; letter-spacing: -1.2px; }
    .price-big .u { font-size: 13px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; margin-left: 5px; }
    .price-none { font-size: 19px; font-weight: 700; color: var(--red); }
    .price-tag {
      margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-2);
      border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 10px; white-space: nowrap;
      background: none; cursor: pointer;
    }
    button.price-tag:hover { border-color: var(--teal); color: var(--ink); }
    .price-sub { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); margin-top: 7px; }

    /* Ce que la machine a lu de la pièce. */
    .fields { padding: 0 22px 13px; display: flex; flex-wrap: wrap; gap: 9px; flex-shrink: 0; }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field.des { flex: 1 1 100%; }
    .field.mat { flex: 1 1 0; }
    .field.qte { flex: 0 0 68px; }
    .field .v {
      font-size: 13px; font-weight: 600; color: var(--ink);
      background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 12px; min-height: 39px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .field .v.none { color: var(--ink-3); font-weight: 500; }

    /* Le calcul : quatre postes sur une ligne, le « pourquoi » du seul poste
       désigné. Quatre paragraphes empilés coûtaient cent pixels de plus et se
       lisaient moins bien. */
    .calc { padding: 0 22px 13px; flex-shrink: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 7px; margin-top: 9px; }
    .card {
      position: relative; overflow: hidden; cursor: pointer; text-align: left;
      background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px;
      padding: 9px 10px 11px; font-family: var(--sans); color: var(--ink);
    }
    .card:hover { border-color: var(--line-2); }
    .card[aria-pressed="true"] { border-color: var(--teal); }
    .card .k { display: block; font-size: 10.5px; color: var(--ink-2); line-height: 1.25; min-height: 26px; }
    .card .v { display: block; font-family: var(--mono); font-size: 16px; font-weight: 600; margin-top: 3px; }
    .card .share { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--teal); opacity: .8; }
    .calc-why {
      font-size: 11px; color: var(--ink-3); line-height: 1.45; margin-top: 9px;
      border-left: 2px solid var(--surface-3); padding-left: 10px;
    }

    /**
     * Les constats : une carte neutre chacun, la couleur réduite à la pastille.
     *
     * Un fond ambre pleine largeur crie au danger même quand le constat dit
     * « rien de particulier ». Fond neutre, les constats rassurants peuvent
     * enfin s'écrire à côté des inquiétants, et c'est la pastille qui trie.
     */
    .alerts { padding: 0 22px 13px; flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .alert-list {
      margin-top: 9px; min-height: 0; overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px;
      scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent;
    }
    .alert {
      display: flex; gap: 12px; font-size: 13px; line-height: 1.45;
      background: var(--surface-2); color: var(--ink);
      border-radius: 10px; padding: 11px 14px;
    }
    .alert .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; background: var(--ink-3); }
    .alert-jaune .dot { background: var(--amber); }
    .alert-vert  .dot { background: var(--green); }
    .alert-rouge .dot { background: var(--red); }
    /* Une liste coupée le dit, au lieu de laisser croire qu'il n'y a que ça. */
    .alert-more { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); padding-top: 7px; }

    /* Les trois issues autres que « valider ». */
    .options { padding: 0 22px 12px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .opt {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 14px; cursor: pointer; font-family: var(--sans); color: var(--ink);
    }
    .opt:hover { border-color: var(--line-2); }
    .opt[aria-checked="true"] { border-color: var(--teal); background: var(--teal-soft); }
    .opt .radio { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--ink-3); flex-shrink: 0; position: relative; }
    .opt[aria-checked="true"] .radio { border-color: var(--teal); }
    .opt[aria-checked="true"] .radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--teal); }
    .opt .t { display: block; font-size: 13px; font-weight: 600; }
    .opt .d { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.35; }
    .opt-body { display: flex; gap: 8px; }
    .opt-body textarea { min-height: 62px; }

    /* Une consigne écrite pour une pièce peut valoir pour toutes : le lien
       vers la règle se propose là où la consigne se lit, et nulle part
       ailleurs — on ne fait pas d'une phrase une doctrine par mégarde. */
    .to-rule {
      font-family: var(--sans); font-size: 11.5px; font-weight: 600; color: var(--teal);
      background: none; border: 0; padding: 4px 0 0; cursor: pointer;
    }
    .to-rule:hover { text-decoration: underline; }
    .to-rule:disabled { color: var(--ink-3); cursor: default; text-decoration: none; }

    .verdict { display: flex; gap: 10px; padding: 13px 22px 15px; border-top: 1px solid var(--line); flex-shrink: 0; }
    .verdict .btn { flex: 1; height: 43px; font-size: 14px; font-weight: 700; border-radius: 9px; border: 0; }
    .btn-validate { background: var(--green); color: #05230F; }
    .btn-validate:hover { background: #4FD07B; color: #05230F; }
    .btn-reject { background: var(--red); color: #2A0A06; }
    .btn-reject:hover { background: #ED6E5D; }
    .btn-ghost { background: var(--surface-3); color: var(--ink); border-color: var(--line-2); }
    .btn-ghost:hover { background: var(--surface-2); }

    input[type="text"], input[type="number"], textarea, select {
      color: var(--ink); background: var(--surface-2); border-color: var(--line);
    }
    input:focus, textarea:focus, select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }

    .note { font-size: 12px; color: var(--ink-2); line-height: 1.55; }
    .note.warn { color: var(--red); font-weight: 600; }
    .empty { padding: 40px 24px; text-align: center; color: var(--ink-3); font-size: 13px; line-height: 1.6; }
    .prop-msg { padding: 12px 22px 0; flex-shrink: 0; }

    /**
     * Un panneau qui ne défile jamais, quelle que soit la fenêtre.
     *
     * Trois paliers, du moins cher au plus cher : la désignation rejoint la
     * ligne matière/quantité, puis le justificatif des issues disparaît, puis
     * les issues se rangent sur une ligne. Aucun chiffre ne part — seul le
     * confort de lecture se resserre.
     */
    @container prop (max-height: 880px) {
      .field.des { flex: 1.5 1 0; }
    }
    @container prop (max-height: 750px) {
      .opt .d { display: none; }
      .price-big { font-size: 31px; }
    }
    @container prop (max-height: 700px) {
      .options { flex-direction: row; flex-wrap: wrap; }
      .opt { flex: 1 1 0; justify-content: center; gap: 8px; padding: 9px 8px; }
      .opt .t { font-size: 12px; white-space: nowrap; }
      .opt-body { flex: 1 1 100%; }
      .calc-why { display: none; }
    }

    /* Sous 1100 px, la revue n'a plus la place de ses deux colonnes : le plan
       passe au-dessus et la page redevient une page qui défile. */
    @media (max-width: 1100px) {
      body { overflow: auto; }
      .workbench { grid-template-columns: 1fr; height: auto; }
      /* Le plan garde de quoi se lire : sous 1100 px il n'est plus contraint
         par la hauteur de la fenêtre, donc rien ne l'oblige à s'écraser. */
      .plan { min-height: 640px; border-right: none; border-bottom: 1px solid var(--line); }
      .plan-sheet.has-plan { min-height: 440px; }
      .proposal { border-left: none; container-type: normal; }
      .load { display: none; }
    }
  </style>
</head>
<body>

  <header class="app-bar">
    <a class="brand" href="/"><img src="/logo.png" alt="Usi-Pro"><span class="brand-rule"></span><span class="brand-app">Internal</span></a>
    <span class="app-name">Chiffrage</span>
    <a class="app-nav" href="/analyse.html">Analyse</a>
    <a class="app-nav" href="/chiffrage.html" aria-current="page">Revue</a>
    <a class="app-nav" href="/parametrage.html">Paramétrage</a>
    <select class="picker" id="picker" aria-label="Devis en cours"></select>
    <div class="spacer"></div>
    <div class="load" id="load"></div>
    <a class="app-nav" href="/">Accueil</a>
  </header>

  <script src="/dossier.js"></script>

  <main class="workbench">
    <section class="plan">
      <div class="plan-bar" id="planBar"><span>—</span></div>
      <div class="plan-body" id="planBody"></div>
      <div class="articles" id="articles"></div>
    </section>

    <aside class="proposal" id="proposal"><div class="empty">chargement…</div></aside>
  </main>

  <script>
    let WORKS = [];
    let CURRENT = null;   // le devis affiché
    let LINES = [];       // ses articles
    let INDEX = 0;        // l'article en revue
    let FILES = [];       // les pièces jointes archivées de ce devis
    let DOC = null;       // le document ouvert { fileId, fileName, pdf, pages }
    let PAGE = 1;         // sa page affichée
    let PICKED = null;    // document choisi à la main — il prime sur le rattachement
    let DOCS_OPEN = false; // la liste complète des documents est dépliée
    let POST = 0;         // le poste de calcul désigné, dont on lit le « pourquoi »
    let CHOICE = null;    // l'issue cochée : 'forcer', 'recalculer' ou null
    let VIEW = 'proposition';  // la vue du panneau : 'proposition' ou 'methode'
    const MAX_CHIPS = 8;   // au-delà, la liste se replie
    let RENDER = 0;       // jeton : un rendu dépassé ne doit pas écraser le suivant

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    /** Ce qui s'affiche dans le cadre : un PDF ou une image. Le reste se télécharge. */
    function isViewable(name) { return /\.(pdf|png|jpe?g)$/i.test(name); }
    function isPdf(name) { return /\.pdf$/i.test(name); }

    /** Pour comparer un nom de fichier à une référence sans buter sur la ponctuation. */
    function normalize(text) { return String(text || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }

    /**
     * Une image de signature n'est pas un plan.
     *
     * Un mail d'entreprise transporte son logo et ses séparateurs, qu'Outlook
     * nomme image001.png et que Gmail rend parfois comme pièces jointes. Les
     * ouvrir par défaut à la place du plan fait perdre un clic à chaque
     * article. Elles restent listées — rien n'est caché — mais ne sont pas le
     * premier choix.
     */
    function looksDecorative(file) {
      if (!/\.(png|jpe?g|gif)$/i.test(file.fileName)) return false;
      if (/^image\d{3}\.(png|gif|jpe?g)$/i.test(file.fileName)) return true;
      // Un plan photographié au téléphone pèse des centaines de kilo-octets ;
      // un bandeau de signature, quelques dizaines. Le nom ne dit rien —
      // sur DE5419, le logo de l'entreprise s'appelait IMG-20220307-WA0014.
      return (file.byteSize || 0) < 150000;
    }

    /**
     * Quel document montrer pour cet article, et à quel point on en est sûr.
     *
     * Un plan nommé d'après la référence de la pièce, c'est une certitude. Un
     * document unique sur une demande à un seul article, c'est raisonnable.
     * Tout le reste est une supposition, et l'écran doit le dire plutôt que de
     * laisser croire que le plan affiché est celui du prix affiché.
     */
    function documentFor(line) {
      const viewable = FILES.filter(f => isViewable(f.fileName));
      if (viewable.length === 0) return { file: null, certainty: 'aucun' };

      const ref = normalize(line && line.reference);
      if (ref.length >= 3) {
        const named = viewable.find(f => normalize(f.fileName).includes(ref));
        if (named) return { file: named, certainty: 'nomme' };
      }

      // Un PDF est presque toujours un vrai plan ; sinon la plus grosse image
      // non décorative, une photo de plan pesant bien plus qu'un logo.
      const serious = viewable.filter(f => !looksDecorative(f));

      // Quand il ne reste rien de sérieux, ne rien ouvrir. Afficher le logo de
      // l'expéditeur à la place d'un plan ferait croire qu'on a reçu quelque
      // chose. Les vignettes restent cliquables pour qui veut vérifier.
      if (serious.length === 0) return { file: null, certainty: 'decoratif' };

      if (serious.length === 1 && LINES.length === 1) {
        return { file: serious[0], certainty: 'unique' };
      }

      const pdfs = serious.filter(f => isPdf(f.fileName));
      const ranked = (pdfs.length ? pdfs : serious)
        .slice()
        .sort((a, b) => (b.byteSize || 0) - (a.byteSize || 0));
      return { file: ranked[0], certainty: 'suppose' };
    }

    const STATUS_LABEL = {
      a_traiter: 'à traiter',
      validee: 'validé',
      forcee: 'prix imposé',
      manuelle: 'traitement manuel',
      rejetee: 'rejeté',
    };

    /** La couleur d'une pastille d'article : son état prime sur son alerte. */
    function dotColor(line) {
      if (line.status === 'rejetee') return 'var(--red)';
      if (line.status && line.status !== 'a_traiter') return 'var(--teal)';
      if (line.alertLevel === 'rouge') return 'var(--red)';
      if (line.alertLevel === 'jaune') return 'var(--amber)';
      return 'var(--green)';
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;   // jamais innerHTML : ce texte vient des mails
      return node;
    }

    function money(value) {
      return value == null ? '—' : value.toFixed(2).replace('.', ',') + ' €';
    }

    // ── Barre du haut : le devis, et ce qu'il reste à en faire ──
    function renderPicker() {
      const picker = document.getElementById('picker');
      picker.innerHTML = '';
      for (const work of WORKS) {
        const opt = el('option', null,
          work.ref + ' · ' + work.client +
          '  (' + (work.lineCount || 0) + ' art.' +
          (work.fileCount > 0 ? ' · ' + work.fileCount + ' doc.' : '') + ')');
        opt.value = work.id;
        opt.selected = !!CURRENT && work.id === CURRENT.id;
        picker.appendChild(opt);
      }
      picker.onchange = () => selectWork(picker.value);
    }

    /**
     * L'avancement, à droite : ce qui reste à traiter dans le devis ouvert.
     *
     * Il ne parle que du devis ouvert — les articles des autres devis ne sont
     * pas chargés, et un compteur global ne serait qu'une estimation. Le menu
     * à gauche dit déjà combien d'articles portent les autres demandes.
     */
    function renderLoad() {
      const box = document.getElementById('load');
      box.innerHTML = '';
      if (!CURRENT || LINES.length === 0) return;

      const pending = LINES.filter(l => l.status === 'a_traiter').length;
      const done = LINES.length - pending;

      const n = el('div', 'load-n');
      n.appendChild(el('div', 'n', String(pending)));
      n.appendChild(el('div', 'l', pending > 1 ? 'articles à traiter' : 'article à traiter'));
      box.appendChild(n);

      const bar = el('div', 'load-bar');
      const track = el('div', 'track');
      const fill = el('span', 'fill');
      fill.style.width = Math.round((done / LINES.length) * 100) + '%';
      track.appendChild(fill);
      bar.appendChild(track);
      bar.appendChild(el('div', 'c', done + ' sur ' + LINES.length + ' traités'));
      box.appendChild(bar);
    }

    // ── Colonne 1 : le plan ───────────────────────────────────
    function renderPlan() {
      const bar = document.getElementById('planBar');
      const body = document.getElementById('planBody');
      bar.innerHTML = ''; body.innerHTML = '';

      const line = LINES[INDEX];
      if (!line) {
        bar.appendChild(el('span', null, CURRENT ? CURRENT.ref : '—'));
        body.appendChild(el('div', null, 'Aucun article à afficher pour ce devis.'));
        return;
      }

      const match = documentFor(line);
      const target = PICKED || match.file;

      bar.appendChild(el('span', null, target ? target.fileName : CURRENT.ref));
      if (target && DOC && DOC.fileId === target.id && DOC.pages > 1) {
        bar.appendChild(el('span', null, '· page ' + PAGE + '/' + DOC.pages));
      }
      if (line.alertLevel && line.alertLevel !== 'vert') {
        bar.appendChild(el('span', 'badge ' + (line.alertLevel === 'rouge' ? 'bad' : 'warn'),
          line.alertLevel === 'rouge' ? 'non chiffrable' : 'sous hypothèse'));
      }
      if (line.status && line.status !== 'a_traiter') {
        bar.appendChild(el('span', 'badge', STATUS_LABEL[line.status]));
      }

      const prev = el('button', 'step', '←');
      prev.type = 'button';
      prev.title = 'Article précédent';
      prev.disabled = INDEX === 0;
      prev.onclick = () => goTo(INDEX - 1);
      const next = el('button', 'step', '→');
      next.type = 'button';
      next.title = 'Article suivant';
      next.disabled = INDEX >= LINES.length - 1;
      next.onclick = () => goTo(INDEX + 1);

      bar.appendChild(el('span', 'pos', 'Article ' + (INDEX + 1) + ' / ' + LINES.length));
      bar.appendChild(prev);
      bar.appendChild(next);

      const sheet = el('div', 'plan-sheet');
      sheet.appendChild(el('div', 'title', (line.reference || '—') + ' · ' + (line.designation || 'sans désignation')));

      const frame = el('div', 'frame');
      if (!target) {
        frame.appendChild(el('span', null,
          match.certainty === 'decoratif'
            ? 'Aucun plan reçu : les images jointes sont des éléments de signature du mail, pas des documents techniques. Elles restent consultables ci-dessous.'
            : FILES.length > 0
            ? 'Aucun plan lisible parmi les pièces jointes — seuls des fichiers à télécharger ont été reçus.'
            : CURRENT.detailsInAttachments
              ? 'Cette demande annonce des pièces jointes, mais aucune n’est arrivée jusqu’ici. Elle est antérieure au pont qui les transmet.'
              : 'Aucun plan reçu avec cette demande. Le chiffrage s’appuie sur le texte du mail.'));
      } else {
        sheet.classList.add('has-plan');
        frame.appendChild(el('span', null, 'ouverture du plan…'));
        showDocument(target, frame);
      }
      sheet.appendChild(frame);

      const cartouche = el('div', 'cartouche');
      [['MATIÈRE', line.material || 'Non lisible'],
       ['QTÉ', line.quantity || '—'],
       ['ÉTAT', STATUS_LABEL[line.status] || '—']].forEach(([k, v]) => {
        const cell = el('div');
        cell.appendChild(el('div', 'dim', k));
        cell.appendChild(el('div', null, String(v)));
        cartouche.appendChild(cell);
      });
      sheet.appendChild(cartouche);
      body.appendChild(sheet);

      body.appendChild(renderDocs(line, match, target));

      if (line.comment) body.appendChild(el('div', null, line.comment));
    }

    /** La bande d'articles, sous le plan : elle remplace le rail de gauche. */
    function renderArticles() {
      const box = document.getElementById('articles');
      box.innerHTML = '';
      if (LINES.length === 0) return;

      LINES.forEach((line, i) => {
        const btn = el('button', 'art');
        btn.type = 'button';
        btn.setAttribute('aria-current', String(i === INDEX));
        btn.title = (line.designation || 'sans désignation') + ' — ' + (STATUS_LABEL[line.status] || '');
        const dot = el('span', 'st');
        dot.style.background = dotColor(line);
        btn.appendChild(dot);
        btn.appendChild(el('span', 'ref', line.reference || String(i + 1)));
        btn.onclick = () => goTo(i);
        box.appendChild(btn);
      });

      // L'article en revue au milieu de la bande, pas hors écran à gauche.
      const active = box.children[INDEX];
      if (active) {
        box.scrollLeft = Math.max(0, active.offsetLeft - (box.clientWidth - active.offsetWidth) / 2);
      }
    }

    /** Changer d'article remet à zéro ce qui appartenait au précédent. */
    function goTo(i) {
      if (i < 0 || i >= LINES.length) return;
      INDEX = i;
      if (CURRENT) Dossier.remember(CURRENT.id, i);
      PICKED = null;
      DOCS_OPEN = false;
      POST = 0;
      CHOICE = null;
      renderAll();
    }

    /** L'adresse d'un fichier archivé, servie par nous. */
    function fileUrl(file) {
      return '/api/works/' + encodeURIComponent(CURRENT.id) +
             '/files/' + encodeURIComponent(file.id) + '/content';
    }

    /**
     * Ouvre un document dans le cadre.
     *
     * Le jeton RENDER protège d'une course : un opérateur qui enchaîne les
     * articles plus vite que ne se charge un PDF ne doit pas voir le plan du
     * précédent s'installer sur celui qu'il regarde.
     */
    async function showDocument(file, frame) {
      const token = ++RENDER;

      if (!isPdf(file.fileName)) {
        const img = el('img');
        img.src = fileUrl(file);
        img.alt = 'Plan ' + file.fileName;
        img.onload = () => { if (token === RENDER) { frame.innerHTML = ''; frame.appendChild(img); } };
        img.onerror = () => {
          if (token !== RENDER) return;
          frame.innerHTML = '';
          frame.appendChild(el('span', null, 'Image illisible : ' + file.fileName));
        };
        return;
      }

      try {
        // Un même document n'est pas rechargé quand on passe d'un article à
        // l'autre : c'est souvent le même plan pour toute la demande.
        if (!DOC || DOC.fileId !== file.id) {
          const pdf = await pdfjsLib.getDocument({ url: fileUrl(file) }).promise;
          if (token !== RENDER) return;
          DOC = { fileId: file.id, fileName: file.fileName, pdf, pages: pdf.numPages };
          PAGE = 1;
        }
        if (PAGE > DOC.pages) PAGE = 1;

        const page = await DOC.pdf.getPage(PAGE);
        if (token !== RENDER) return;

        // Rendu à la taille du cadre, en tenant compte de la densité d'écran :
        // une cote lue de travers ne sert à personne.
        const box = frame.getBoundingClientRect();
        const base = page.getViewport({ scale: 1 });
        const scale = Math.max(
          0.1,
          Math.min(box.width / base.width, box.height / base.height),
        );
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const viewport = page.getViewport({ scale: scale * dpr });

        const canvas = el('canvas');
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.style.width = Math.floor(viewport.width / dpr) + 'px';
        canvas.style.height = Math.floor(viewport.height / dpr) + 'px';

        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        if (token !== RENDER) return;

        frame.innerHTML = '';
        frame.appendChild(canvas);
        refreshDocs();
      } catch (err) {
        if (token !== RENDER) return;
        frame.innerHTML = '';
        frame.appendChild(el('span', null, 'Plan illisible : ' + err.message));
      }
    }

    /**
     * Les documents reçus, et ce que vaut le rattachement.
     *
     * Dire « plan supposé » coûte une ligne ; laisser croire qu'un plan est
     * celui de l'article chiffré coûte un devis faux.
     */
    function renderDocs(line, match, target) {
      const box = el('div', 'docs-wrap');
      box.style.display = 'flex';
      box.style.flexDirection = 'column';
      box.style.gap = '9px';
      box.style.alignItems = 'center';

      if (FILES.length === 0) return box;

      // Un package de plans peut contenir soixante fichiers. Tout afficher
      // écrase la feuille au profit d'une liste que personne ne lit: on montre
      // le document ouvert, et le reste sur demande.
      const many = FILES.length > MAX_CHIPS;
      const shown = many && !DOCS_OPEN
        ? FILES.filter(f => target && f.id === target.id)
        : FILES;

      const chips = el('div', 'docs');
      for (const file of shown) {
        if (isViewable(file.fileName)) {
          const chip = el('button', 'doc-chip', file.fileName);
          chip.type = 'button';
          chip.setAttribute('aria-current', String(!!target && file.id === target.id));
          chip.onclick = () => { PICKED = file; PAGE = 1; renderPlan(); };
          chips.appendChild(chip);
        } else {
          // Un tableur ou un STEP ne s'affiche pas : il se récupère.
          const link = el('a', 'doc-chip', file.fileName);
          link.href = fileUrl(file);
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.appendChild(el('span', 'n', '↓'));
          chips.appendChild(link);
        }
      }
      if (many) {
        const toggle = el('button', 'doc-chip',
          DOCS_OPEN
            ? 'replier la liste'
            : 'voir les ' + FILES.length + ' documents');
        toggle.type = 'button';
        toggle.onclick = () => { DOCS_OPEN = !DOCS_OPEN; renderPlan(); };
        chips.appendChild(toggle);
      }
      box.appendChild(chips);

      if (target && DOC && DOC.fileId === target.id && DOC.pages > 1) {
        const pager = el('div', 'docs');
        const prev = el('button', 'doc-chip', '← page');
        prev.type = 'button';
        prev.disabled = PAGE <= 1;
        prev.onclick = () => { PAGE--; renderPlan(); };
        const next = el('button', 'doc-chip', 'page →');
        next.type = 'button';
        next.disabled = PAGE >= DOC.pages;
        next.onclick = () => { PAGE++; renderPlan(); };
        pager.appendChild(prev);
        pager.appendChild(el('span', 'doc-note', 'page ' + PAGE + ' / ' + DOC.pages));
        pager.appendChild(next);
        box.appendChild(pager);
      }

      if (target) {
        const certainty = PICKED ? 'choisi' : match.certainty;
        const NOTE = {
          nomme: ['Ce plan porte la référence de l’article — rattachement certain.', false],
          unique: ['Seul document reçu, et un seul article dans la demande.', false],
          suppose: ['Rattachement supposé : aucun document ne porte la référence de cet article. Vérifiez avant de valider.', true],
          choisi: ['Document choisi à la main.', false],
        }[certainty];
        if (NOTE) {
          box.appendChild(el('div', 'doc-note' + (NOTE[1] ? ' uncertain' : ''), NOTE[0]));
        }
      }

      return box;
    }

    /** Redessine la seule barre de documents, une fois le PDF ouvert et paginé. */
    function refreshDocs() {
      const body = document.getElementById('planBody');
      const old = body.querySelector('.docs-wrap');
      if (!old) return;
      const line = LINES[INDEX];
      const match = documentFor(line);
      old.replaceWith(renderDocs(line, match, PICKED || match.file));
    }

    // ── Colonne 2 : la proposition ────────────────────────────

    /**
     * Le panneau de droite : deux vues d'un même article, et un verdict.
     *
     * « Proposition » porte le prix et les issues, « Méthode » dit comment ce
     * prix a été fait. Le verdict reste hors des onglets : c'est l'article
     * qu'on tranche, pas la vue qu'on regarde, et devoir revenir sur un onglet
     * pour valider serait un piège.
     */
    function renderProposal() {
      const box = document.getElementById('proposal');
      box.innerHTML = '';

      const line = LINES[INDEX];
      if (!line) {
        box.appendChild(el('div', 'empty',
          CURRENT && CURRENT.detailsInAttachments
            ? 'Cette demande n’a aucune ligne lisible : son contenu est dans les pièces jointes.'
            : 'Aucun article.'));
        return;
      }

      box.appendChild(renderTabs());

      // La méthode est longue par nature : c'est la seule vue qui défile.
      const view = el('div', 'prop-view' + (VIEW === 'methode' ? ' methode' : ''));
      if (VIEW === 'methode') view.appendChild(renderMethod(line));
      else renderProposition(view, line);
      box.appendChild(view);

      const verdict = el('div', 'verdict');
      const reject = el('button', 'btn btn-reject', '✕ Rejeter');
      reject.type = 'button';
      reject.onclick = () => review(line, 'rejeter');
      const validate = el('button', 'btn btn-validate', '✓ Valider');
      validate.type = 'button';
      validate.onclick = () => review(line, 'valider');
      verdict.appendChild(reject);
      verdict.appendChild(validate);
      box.appendChild(verdict);

      if (VIEW !== 'methode') countHiddenAlerts();
    }

    function renderTabs() {
      const tabs = el('div', 'prop-tabs');
      tabs.setAttribute('role', 'tablist');
      for (const [key, label] of [['proposition', 'Proposition'], ['methode', 'Méthode']]) {
        const tab = el('button', null, label);
        tab.type = 'button';
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-selected', String(VIEW === key));
        tab.onclick = () => { VIEW = key; renderProposal(); };
        tabs.appendChild(tab);
      }
      return tabs;
    }

    function renderProposition(box, line) {
      // Le prix, et d'où il vient.
      const head = el('div', 'prop-head');
      head.appendChild(el('div', 'eyebrow', 'Proposition · prix de revient unitaire'));
      const row = el('div', 'price-row');
      if (line.unitPrice != null) {
        const price = el('div', 'price-big', money(line.unitPrice));
        price.appendChild(el('span', 'u', '/ pièce'));
        row.appendChild(price);
        // La puce dit d'où vient le prix : cliquer dessus doit mener à la
        // démonstration, pas seulement la nommer.
        const tag = el('button', 'price-tag',
          line.status === 'forcee' ? 'prix imposé' : 'calcul déterministe');
        tag.type = 'button';
        tag.title = 'Voir la méthode de calcul';
        tag.onclick = () => { VIEW = 'methode'; renderProposal(); };
        row.appendChild(tag);
      } else {
        row.appendChild(el('div', 'price-none', 'Pas de prix'));
        row.appendChild(el('span', 'price-tag',
          line.status === 'manuelle' ? 'à compléter à la main' : 'non chiffrable'));
      }
      head.appendChild(row);
      head.appendChild(el('div', 'price-sub',
        line.unitPrice != null
          ? money(line.totalPrice) + ' pour la série de ' + (line.quantity || '—')
          : line.status === 'manuelle'
            ? 'ligne sortie du chiffrage'
            : 'article non chiffrable en l’état'));
      box.appendChild(head);

      // Ce que la machine a lu de la pièce.
      const fields = el('div', 'fields');
      [['des', 'Désignation', line.designation, 'non lisible'],
       ['mat', 'Matière', line.material, 'non lisible'],
       ['qte', 'Qté', line.quantity, '—']].forEach(([cls, label, value, fallback]) => {
        const f = el('div', 'field ' + cls);
        f.appendChild(el('span', 'eyebrow', label));
        const v = el('div', 'v' + (value ? '' : ' none'), value ? String(value) : fallback);
        v.title = value ? String(value) : fallback;   // la désignation tronquée reste lisible au survol
        f.appendChild(v);
        fields.appendChild(f);
      });
      box.appendChild(fields);

      // Le calcul : un chiffre par poste, le « pourquoi » du poste désigné.
      const items = (line.priceBreakdown && line.priceBreakdown.items) || [];
      const calc = el('div', 'calc');
      calc.appendChild(el('div', 'eyebrow', 'Détail du calcul'));
      if (items.length === 0) {
        calc.appendChild(el('div', 'calc-why', 'Aucun calcul : cette ligne n’a pas été chiffrée.'));
      } else {
        if (POST >= items.length) POST = 0;
        const total = items.reduce((sum, it) => sum + Math.abs(it.amount || 0), 0);
        const cards = el('div', 'cards');
        items.forEach((item, i) => {
          const card = el('button', 'card');
          card.type = 'button';
          card.setAttribute('aria-pressed', String(i === POST));
          card.appendChild(el('span', 'k', item.label));
          card.appendChild(el('span', 'v', money(item.amount)));
          // La barre sous la carte dit la part du poste dans le prix.
          const share = el('span', 'share');
          share.style.width = total > 0
            ? Math.round((Math.abs(item.amount || 0) / total) * 100) + '%'
            : '0%';
          card.appendChild(share);
          card.onclick = () => { POST = i; renderProposal(); };
          cards.appendChild(card);
        });
        calc.appendChild(cards);
        calc.appendChild(el('div', 'calc-why', items[POST].basis || '—'));
      }
      box.appendChild(calc);

      // Les constats : une carte neutre chacun, la pastille porte le niveau.
      const alerts = el('div', 'alerts');
      alerts.appendChild(el('div', 'eyebrow', 'Alertes'));
      const list = el('div', 'alert-list');
      const texts = (line.alerts && line.alerts.length) ? line.alerts : [];
      if (texts.length === 0) {
        const ok = el('div', 'alert alert-vert');
        ok.appendChild(el('span', 'dot'));
        ok.appendChild(el('span', null, 'Rien à signaler : la demande se suffit à elle-même.'));
        list.appendChild(ok);
      }
      for (const text of texts) {
        const a = el('div', 'alert alert-' + (line.alertLevel || 'jaune'));
        a.appendChild(el('span', 'dot'));
        a.appendChild(el('span', null, text));
        list.appendChild(a);
      }
      alerts.appendChild(list);
      const more = el('div', 'alert-more');
      more.hidden = true;
      alerts.appendChild(more);
      box.appendChild(alerts);

      box.appendChild(renderChoices(line));

      if (line.reviewNote) {
        const n = el('div', 'prop-msg');
        n.appendChild(el('div', 'note', 'Consigne du technicien : ' + line.reviewNote));
        // La consigne a été écrite pour cette pièce. Si elle vaut pour toutes,
        // c'est ici qu'on le dit — le texte part tel quel, sans réécriture.
        const go = el('button', 'to-rule', 'Proposer cette consigne comme règle →');
        go.type = 'button';
        go.onclick = () => proposeRule(line.reviewNote, go);
        n.appendChild(go);
        box.insertBefore(n, box.firstChild);
      }
    }

    /**
     * L'onglet Méthode : comment ce prix a été fait, en français.
     *
     * Ce texte n'est pas un second calcul — rien ne serait pire que deux
     * démonstrations qui divergent. Chaque paragraphe met en phrase les
     * montants du bordereau, et cite en dessous la base que le moteur a
     * lui-même écrite. Si le moteur change, le récit change avec lui.
     *
     * Pourquoi en prose plutôt qu'en tableau : le tableau est déjà là, dans
     * l'onglet d'à côté. Ce qu'un tableau ne sait pas dire, c'est ce qui pèse
     * et pourquoi — « sur cette pièce, c'est le bloc qu'on achète, pas le
     * temps qu'on passe » est la phrase qu'on répète au client au téléphone.
     */
    function renderMethod(line) {
      const box = el('div', 'method');
      const b = line.priceBreakdown;

      if (!b || !(b.items || []).length) {
        box.appendChild(el('div', 'empty',
          line.status === 'manuelle'
            ? 'Ligne sortie du chiffrage automatique : il n’y a pas de méthode à montrer.'
            : 'Cette ligne n’a pas été chiffrée — aucun calcul à expliquer.'));
        return box;
      }

      const item = (label) => (b.items || []).find(i => i.label === label);
      const starts = (prefix) => (b.items || []).find(i => i.label.indexOf(prefix) === 0);
      const quantity = b.quantity || 1;

      // La part d'un poste dans le prix : c'est elle qui dit où regarder.
      const share = (amount) =>
        line.unitPrice ? Math.round((Math.abs(amount) / line.unitPrice) * 100) : null;

      /** Une phrase dont les chiffres sont en chasse fixe : on doit pouvoir les pointer. */
      function say(parts) {
        const p = el('p');
        for (const part of parts) {
          if (part == null) continue;
          if (typeof part === 'string') p.appendChild(document.createTextNode(part));
          else p.appendChild(el('span', 'n', part.n));
        }
        return p;
      }

      /** Un paragraphe, et la base que le moteur a écrite pour le soutenir. */
      function para(parts, ...bases) {
        const block = el('div', 'para');
        block.appendChild(say(parts));
        for (const base of bases) {
          if (base && base.basis) block.appendChild(el('div', 'from', base.basis));
        }
        box.appendChild(block);
      }

      const nombre = (value, unit) =>
        ({ n: String(Math.round(value * 100) / 100).replace('.', ',') + (unit ? ' ' + unit : '') });
      const pct = (value) => ({ n: value + ' %' });

      // ── La gamme : elle commande tout le reste ──
      const GAMMES = {
        fraisage: ['Fraisage', 'bridée à l’étau et reprise par repositionnement — ses trois cotes doivent entrer dans les courses de la machine'],
        tournage: ['Tournage', 'une pièce de révolution part au tour : les courses de la fraiseuse ne la concernent pas'],
        debit_tole: ['Débit tôle', 'fine et large, elle est débitée puis reprise sur une seule face — on ne fraise pas les deux'],
      };
      const gamme = GAMMES[b.route];
      if (gamme) {
        const g = el('div', 'gamme');
        const head = el('div', 'k');
        head.appendChild(el('span', 'eyebrow', 'Gamme retenue'));
        head.appendChild(el('strong', null, gamme[0]));
        g.appendChild(head);
        g.appendChild(el('p', null, gamme[1][0].toUpperCase() + gamme[1].slice(1) + '.'));
        box.appendChild(g);
      }

      // ── Ce qui ne passe pas en l'état ──
      for (const finding of b.findings || []) {
        const warn = el('div', 'para');
        const p = el('p', line.alertLevel === 'rouge' ? 'bad' : 'warn');
        p.textContent = 'Avant de s’engager : ' + finding;
        warn.appendChild(p);
        box.appendChild(warn);
      }

      // ── La matière ──
      const matiere = item('Matière');
      if (matiere) {
        const poids = b.rawMassKg;
        const part = share(matiere.amount);
        para([
          poids ? 'Le brut englobant pèse ' : 'La matière coûte ',
          poids ? nombre(poids, 'kg') : { n: money(matiere.amount) },
          poids ? ' : la matière coûte ' : ' par pièce',
          poids ? { n: money(matiere.amount) } : null,
          poids ? ' par pièce' : null,
          part != null ? ', soit ' : '',
          part != null ? pct(part) : null,
          part != null ? ' du prix.' : '.',
          part != null && part >= 55
            ? ' Sur cette pièce, c’est le bloc qu’on achète, pas le temps qu’on passe.'
            : part != null && part <= 15
              ? ' Ce n’est pas la matière qui fait ce prix.'
              : '',
        ], matiere);
      }

      // ── Le temps ──
      const usinage = item('Usinage');
      if (usinage) {
        const part = share(usinage.amount);
        para([
          b.unitMinutes ? 'On y passe ' : 'L’usinage vaut ',
          b.unitMinutes ? nombre(b.unitMinutes, 'min') : { n: money(usinage.amount) },
          b.unitMinutes
            ? (quantity > 1 ? ' par pièce en moyenne sur la série, dégressivité comprise : ' : ' par pièce : ')
            : '',
          b.unitMinutes ? { n: money(usinage.amount) } : null,
          part != null ? ', soit ' : '',
          part != null ? pct(part) : null,
          part != null ? ' du prix.' : '.',
        ], usinage);
      }

      // ── Ce qui est payé une fois ──
      const prog = item('Programmation amortie');
      const mise = item('Mise en train amortie');
      if (prog || mise) {
        // Un seul poste ou deux, une pièce ou cent : la phrase s'accorde. Un
        // « payé une seule fois et réparties » se remarque immédiatement, et
        // décrédibilise le reste du récit.
        const deux = prog && mise;
        const sujet = deux
          ? 'La programmation CAO et la mise en train sont payées une seule fois'
          : (prog ? 'La programmation CAO est payée une seule fois' : 'La mise en train est payée une seule fois');
        para([
          sujet,
          quantity > 1 ? (deux ? ' et réparties sur les ' : ' et répartie sur les ') : ' — mais la série est d’une seule pièce : ',
          quantity > 1 ? { n: String(quantity) } : null,
          quantity > 1 ? ' pièces : ' : '',
          prog ? { n: money(prog.amount) } : null,
          deux ? ' et ' : '',
          mise ? { n: money(mise.amount) } : null,
          '.',
          quantity > 1
            ? (deux ? ' Sur une quantité plus grande, ces deux postes baisseraient encore.'
                    : ' Sur une quantité plus grande, ce poste baisserait encore.')
            : ' Elle est portée en entier par la pièce.',
        ], prog, mise);
      }

      // ── Un tarif client passe devant le calcul, mais jamais en silence ──
      const impose = starts('Prix imposé');
      if (impose) {
        para(['Ce prix n’est pas celui du calcul : un tarif client est imposé pour ce compte. Le calcul reste au bordereau, et l’écart est nommé.'], impose);
      }

      // ── Le verdict chiffré ──
      const marge = starts('Marge');
      if (marge && line.unitPrice != null) {
        // Le revient se déduit du prix, il ne se resomme pas : additionner des
        // postes déjà arrondis donnait 131,05 € là où le moteur a calculé
        // 131,06 €, et un centime d'écart suffit à faire douter du reste.
        const revient = Math.round((line.unitPrice - marge.amount) * 100) / 100;
        para([
          'Coût de revient : ',
          { n: money(revient) },
          '. Avec la ' + marge.label.replace(/^Marge\s*/, 'marge de ') + ', le prix proposé est de ',
          { n: money(line.unitPrice) },
          ' la pièce',
          line.totalPrice != null ? ', soit ' : '.',
          line.totalPrice != null ? { n: money(line.totalPrice) } : null,
          line.totalPrice != null ? ' pour la série de ' : '',
          line.totalPrice != null ? { n: String(quantity) } : null,
          line.totalPrice != null ? '.' : '',
        ]);
      }

      // ── Ce que personne n'a mesuré ──
      const doute = el('div', 'para');
      doute.appendChild(el('span', 'eyebrow', 'Ce que personne n’a mesuré'));
      if ((b.assumptions || []).length) {
        const list = el('ul', 'suppose');
        for (const assumption of b.assumptions) list.appendChild(el('li', null, assumption));
        doute.appendChild(list);
      } else {
        doute.appendChild(el('p', null,
          'Rien n’a été supposé sur cet article : la demande donnait l’encombrement, la matière et la quantité.'));
      }
      const fin = el('p');
      fin.appendChild(document.createTextNode(
        'Deux réglages restent des hypothèses de départ, jamais mesurées dans votre atelier : la part de matière enlevée et la courbe de série. Elles se corrigent au '));
      const lien = el('a', null, 'Paramétrage');
      lien.href = '/parametrage.html';
      fin.appendChild(lien);
      fin.appendChild(document.createTextNode('.'));
      doute.appendChild(fin);
      box.appendChild(doute);

      return box;
    }

    /**
     * Combien de constats la liste cache-t-elle, à cette hauteur de fenêtre ?
     *
     * C'est la seule zone du panneau dont la longueur est imprévisible : un
     * article peut n'avoir aucun constat comme en avoir six. Quand elle coupe,
     * elle le dit — sinon l'écran laisse croire qu'il n'y avait que ça.
     */
    function countHiddenAlerts() {
      const list = document.querySelector('.alert-list');
      const more = document.querySelector('.alert-more');
      if (!list || !more) return;
      const box = list.getBoundingClientRect();
      const hidden = [...list.querySelectorAll('.alert')]
        .filter(a => a.getBoundingClientRect().bottom > box.bottom + 1).length;
      more.hidden = hidden === 0;
      more.textContent = hidden === 1 ? '↓ 1 autre constat' : '↓ ' + hidden + ' autres constats';
    }

    /** Les trois issues autres que « valider » : imposer, recalculer, sortir. */
    function renderChoices(line) {
      const box = el('div', 'options');

      /** Une issue : un bouton radio, et la saisie qu'elle ouvre. */
      function option(key, title, detail, onPick) {
        const btn = el('button', 'opt');
        btn.type = 'button';
        btn.setAttribute('aria-checked', String(CHOICE === key));
        btn.setAttribute('role', 'radio');
        btn.appendChild(el('span', 'radio'));
        const text = el('span');
        text.appendChild(el('span', 't', title));
        text.appendChild(el('span', 'd', detail));
        btn.appendChild(text);
        btn.onclick = onPick || (() => { CHOICE = CHOICE === key ? null : key; renderProposal(); });
        box.appendChild(btn);
        return btn;
      }

      option('forcer', 'Forcer le prix', 'prix imposé, sans recalcul — le calcul reste au bordereau');
      if (CHOICE === 'forcer') {
        const body = el('div', 'opt-body');
        const input = el('input');
        input.type = 'number'; input.step = '0.01'; input.min = '0';
        input.placeholder = 'prix unitaire imposé';
        input.setAttribute('aria-label', 'Prix unitaire imposé');
        input.style.flex = '1';
        const go = el('button', 'btn btn-ghost', 'Imposer');
        go.type = 'button';
        go.style.height = '39px';
        go.onclick = () => review(line, 'forcer', { price: Number(input.value) });
        body.appendChild(input);
        body.appendChild(go);
        box.appendChild(body);
        setTimeout(() => input.focus(), 0);
      }

      option('recalculer', 'Commentaire de recalcul', 'l’outil recalcule avec votre consigne');
      if (CHOICE === 'recalculer') {
        const body = el('div', 'opt-body');
        const note = el('textarea');
        note.rows = 2;
        note.placeholder = 'ex : reprendre en inox 316L, brut barre Ø60';
        note.setAttribute('aria-label', 'Consigne de recalcul');
        note.style.flex = '1';
        const go = el('button', 'btn btn-ghost', 'Envoyer');
        go.type = 'button';
        go.style.height = '39px';
        go.onclick = () => review(line, 'recalculer', { note: note.value });
        body.appendChild(note);
        body.appendChild(go);
        box.appendChild(body);
        setTimeout(() => note.focus(), 0);
      }

      option('regle', 'Proposer une règle', 'vaut pour tous les devis — après validation au paramétrage');
      if (CHOICE === 'regle') {
        const body = el('div', 'opt-body');
        const text = el('textarea');
        text.rows = 2;
        text.maxLength = 600;
        text.placeholder = 'ex : usinages sur deux faces opposées — seconde prise, +3 min/pièce et +20 min de réglage';
        text.setAttribute('aria-label', 'Règle proposée');
        text.style.flex = '1';
        const go = el('button', 'btn btn-ghost', 'Proposer');
        go.type = 'button';
        go.style.height = '39px';
        go.onclick = () => proposeRule(text.value, go);
        body.appendChild(text);
        body.appendChild(go);
        box.appendChild(body);
        setTimeout(() => text.focus(), 0);
      }

      option('manuel', 'Traitement manuel', 'la ligne part sans prix, marquée à compléter',
        () => review(line, 'manuel'));

      return box;
    }

    /**
     * Proposer une règle depuis la revue.
     *
     * Elle n'agit pas en partant d'ici : elle arrive au paramétrage en
     * « à valider », et quelqu'un décide si ce qu'un technicien a constaté sur
     * une pièce vaut pour tous les devis de l'atelier. C'est la barrière, et
     * elle est volontairement de l'autre côté de l'écran.
     */
    async function proposeRule(text, button) {
      const rule = (text || '').trim();
      const box = document.getElementById('proposal');
      if (!rule) return;

      if (button) button.disabled = true;
      try {
        const resp = await fetch('/api/parametrage/rules', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: rule,
            origin: 'revue',
            workId: CURRENT ? CURRENT.id : undefined,
          }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.message || 'HTTP ' + resp.status);

        const waiting = (data.rules || []).filter(r => r.status === 'a_valider').length;
        CHOICE = null;
        renderProposal();
        const done = el('div', 'prop-msg');
        done.appendChild(el('div', 'note',
          'Règle proposée — elle n’agit pas encore. ' +
          waiting + (waiting > 1 ? ' règles attendent' : ' règle attend') + ' une validation au paramétrage.'));
        document.getElementById('proposal').prepend(done);
      } catch (err) {
        const warn = el('div', 'prop-msg');
        warn.appendChild(el('div', 'note warn', 'Règle non proposée : ' + err.message));
        box.prepend(warn);
      } finally {
        if (button) button.disabled = false;
      }
    }

    // ── La décision ────────────────────────────────────────────
    async function review(line, action, options = {}) {
      try {
        const resp = await fetch('/api/lines/' + encodeURIComponent(line.id) + '/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, ...options }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.message || 'HTTP ' + resp.status);

        LINES[INDEX] = { ...LINES[INDEX], ...data.line };
        CHOICE = null;
        POST = 0;
        // La revue s'enchaîne : on passe à l'article suivant, sauf si on vient
        // de demander un recalcul — là on reste pour en voir le résultat.
        if (action !== 'recalculer' && INDEX < LINES.length - 1) {
          INDEX++;
          PICKED = null;
          DOCS_OPEN = false;
        }
        renderAll();
      } catch (err) {
        const box = document.getElementById('proposal');
        const warn = el('div', 'prop-msg');
        warn.appendChild(el('div', 'note warn', 'Décision non enregistrée : ' + err.message));
        box.prepend(warn);
      }
    }

    function renderAll() {
      Dossier.carry();
      renderPicker();
      renderLoad();
      renderPlan();
      renderArticles();
      renderProposal();
    }

    async function selectWork(id) {
      CURRENT = WORKS.find(w => w.id === id) || null;
      if (CURRENT) Dossier.remember(CURRENT.id, 0);
      INDEX = 0;
      LINES = [];
      FILES = [];
      DOC = null;
      PICKED = null;
      PAGE = 1;
      POST = 0;
      CHOICE = null;
      RENDER++;   // les plans du devis précédent ne doivent plus s'afficher
      renderAll();
      if (!CURRENT) return;

      // Les articles et les pièces jointes en parallèle : l'écran n'a pas de
      // raison d'attendre deux allers-retours l'un après l'autre.
      const [lines, files] = await Promise.all([
        fetch('/api/works/' + encodeURIComponent(CURRENT.id) + '/lines')
          .then(r => r.json()).then(d => d.lines || []).catch(() => []),
        fetch('/api/works/' + encodeURIComponent(CURRENT.id) + '/files')
          .then(r => r.json()).then(d => d.files || []).catch(() => []),
      ]);
      LINES = lines;
      FILES = files;
      renderAll();
    }

    async function load() {
      const proposal = document.getElementById('proposal');
      try {
        const resp = await fetch('/api/works?tool=chiffrage&limit=100');
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.message || 'HTTP ' + resp.status);

        WORKS = data.works || [];
        if (WORKS.length === 0) {
          proposal.innerHTML = '';
          proposal.appendChild(el('div', 'empty',
            'Aucune demande reçue. Un mail envoyé à chiffrage@usi-pro.com apparaît ici dans la minute.'));
          return;
        }
        // Le devis de l'adresse — celle que pose l'écran d'analyse — ou, à
        // défaut, celui qu'on regardait avant de changer d'onglet.
        const asked = Dossier.open();
        const start = WORKS.find(w => w.id === asked.id) || WORKS[0];
        await selectWork(start.id);
        if (asked.index !== null && asked.index < LINES.length) goTo(asked.index);
      } catch (err) {
        proposal.innerHTML = '';
        proposal.appendChild(el('div', 'empty', 'Demandes injoignables : ' + err.message));
      }
    }

    // Le plan se redessine à la taille du cadre, et le compte de constats
    // cachés dépend de la hauteur : les deux se refont au redimensionnement.
    let RESIZE;
    window.addEventListener('resize', () => {
      clearTimeout(RESIZE);
      RESIZE = setTimeout(() => { renderPlan(); countHiddenAlerts(); }, 150);
    });

    load();
  </script>
</body>
</html>
