<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usi-Pro Chiffrage — Revue technique</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/usipro.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    /* ── Trois colonnes : les devis, le plan, la proposition ── */
    .workbench {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr) 400px;
      height: calc(100vh - 56px);
    }

    /* Colonne 1 — les devis en cours */
    .rail {
      background: var(--surface);
      border-right: 1px solid var(--line);
      padding: 18px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .rail-head { display: flex; flex-direction: column; gap: 4px; }
    .rail-ref { font-family: var(--mono); font-size: 13px; font-weight: 600; }
    .rail-client { font-size: 12px; color: var(--ink-2); }
    .rail-count { display: flex; align-items: baseline; gap: 8px; }
    .rail-count .n { font-family: var(--mono); font-size: 26px; font-weight: 600; line-height: 1; }
    .rail-count .label { font-size: 11.5px; color: var(--ink-3); max-width: 96px; line-height: 1.3; }

    .devis-list { display: flex; flex-direction: column; gap: 2px; }
    .devis {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 10px; border-radius: 6px;
      cursor: pointer; background: none; border: none; width: 100%;
      text-align: left; font-family: var(--sans); color: var(--ink);
    }
    .devis:hover { background: var(--surface-2); }
    .devis[aria-current="true"] { background: var(--teal-soft); }
    .devis .ref { font-family: var(--mono); font-size: 12px; flex-grow: 1; }
    .devis .n { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }

    /* Colonne 2 — le plan */
    .plan { background: var(--plan); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .plan-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.72);
      font-family: var(--mono); font-size: 11.5px;
    }
    .plan-bar .badge {
      background: rgba(255,255,255,.1); color: rgba(255,255,255,.85);
      border-radius: 4px; padding: 3px 7px; font-size: 10.5px;
    }
    .plan-body {
      flex-grow: 1; min-height: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      padding: 22px; text-align: center;
      color: rgba(255,255,255,.55); font-size: 12.5px; line-height: 1.6;
      overflow-y: auto;
    }
    .plan-sheet {
      background: var(--paper); color: var(--ink);
      width: min(560px, 100%); aspect-ratio: 1.414;
      flex-shrink: 0;
      border-radius: 4px; padding: 22px;
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 18px 40px -18px rgba(0,0,0,.6);
      text-align: left;
    }
    /* Un plan réel prend toute la hauteur offerte : le format A4 fixe n'est
       qu'un cadre d'attente, il ne doit pas rétrécir une cote à lire. */
    .plan-sheet.has-plan {
      aspect-ratio: auto; width: min(820px, 100%);
      flex: 1 1 auto; min-height: 200px;
    }

    .plan-sheet .title { font-family: var(--mono); font-size: 12px; font-weight: 600; }
    .plan-sheet .frame {
      flex-grow: 1; min-height: 0;
      border: 1px solid var(--line-2); border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-3); font-size: 12px; text-align: center; line-height: 1.6;
      overflow: hidden; background: #fff;
    }
    .plan-sheet .frame > span { padding: 16px; }
    /* Le plan occupe le cadre sans le déborder, quelle que soit son orientation. */
    .plan-sheet .frame canvas,
    .plan-sheet .frame img { max-width: 100%; max-height: 100%; display: block; }

    /* Les documents reçus avec la demande, sous la feuille. */
    .docs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
    .doc-chip {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .03em;
      background: rgba(255,255,255,.08); color: rgba(255,255,255,.8);
      border: 1px solid rgba(255,255,255,.14); border-radius: 4px;
      padding: 4px 9px; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .doc-chip:hover { background: rgba(255,255,255,.16); }
    .doc-chip[aria-current="true"] {
      background: var(--teal); color: #05312B; border-color: var(--teal);
    }
    .doc-chip .n { opacity: .6; }
    .doc-note { font-size: 11.5px; color: rgba(255,255,255,.5); max-width: 62ch; }
    .doc-note.uncertain { color: #F1C86B; }
    .plan-sheet .cartouche {
      border: 1px solid var(--line-2); border-radius: 2px; padding: 8px 10px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      font-family: var(--mono); font-size: 10.5px; color: var(--ink-2);
    }
    .plan-nav {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px; border-top: 1px solid rgba(255,255,255,.08);
    }
    .plan-nav .btn { height: 34px; padding: 0 12px; font-size: 12px; }
    .plan-nav .pos { font-family: var(--mono); font-size: 12px; color: rgba(255,255,255,.72); }

    /* Colonne 3 — la proposition */
    .proposal {
      background: var(--surface); border-left: 1px solid var(--line);
      overflow-y: auto; display: flex; flex-direction: column;
    }
    .prop-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
    .price-big { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1.1; margin: 8px 0 4px; }
    .price-none { font-size: 17px; font-weight: 600; color: var(--red); margin: 8px 0 4px; }
    .price-sub { font-size: 12px; color: var(--ink-3); }

    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); }
    .fact { background: var(--surface); padding: 12px 14px; }
    .fact .k {
      font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ink-3);
    }
    .fact .v { font-size: 13px; font-weight: 600; margin-top: 3px; word-break: break-word; }

    .section {
      padding: 16px 20px; border-bottom: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 10px;
    }
    .detail-row { display: flex; align-items: baseline; gap: 10px; font-size: 12.5px; }
    .detail-row .label { flex-grow: 1; color: var(--ink-2); }
    .detail-row .amount { font-family: var(--mono); font-weight: 600; }
    .detail-basis { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; margin: -4px 0 4px; }

    .alert { display: flex; gap: 9px; font-size: 12.5px; line-height: 1.5; }
    .alert .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
    .alert-rouge .dot { background: var(--red); }
    .alert-jaune .dot { background: var(--amber); }
    .alert-vert .dot { background: var(--green); }

    .choice {
      display: flex; flex-direction: column; gap: 3px;
      padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px;
      cursor: pointer; background: var(--surface); text-align: left; width: 100%;
      font-family: var(--sans);
    }
    .choice:hover { border-color: var(--line-2); background: var(--surface-2); }
    .choice[aria-expanded="true"] { border-color: var(--teal); background: var(--teal-soft); }
    .choice .t { font-size: 13px; font-weight: 600; }
    .choice .d { font-size: 11.5px; color: var(--ink-2); }
    .choice-body { display: flex; flex-direction: column; gap: 8px; padding: 4px 0 2px; }

    .verdict { display: flex; gap: 10px; padding: 16px 20px; }
    .verdict .btn { flex: 1; }

    .note { font-size: 12px; color: var(--ink-2); line-height: 1.55; }
    .note.done { color: var(--teal-ink); font-weight: 600; }
    .note.warn { color: var(--red); font-weight: 600; }

    .empty { padding: 40px 24px; text-align: center; color: var(--ink-3); font-size: 13px; line-height: 1.6; }

    @media (max-width: 1100px) {
      .workbench { grid-template-columns: 1fr; height: auto; }
      .rail, .proposal { border: none; border-bottom: 1px solid var(--line); }
      .plan { min-height: 440px; }
    }
  </style>
</head>
<body>

  <header class="app-bar">
    <span class="app-name">Usi<em>·</em>Pro Chiffrage</span>
    <a class="app-nav" href="/chiffrage.html" aria-current="page">Devis</a>
    <a class="app-nav" href="/parametrage.html">Paramétrage</a>
    <div class="spacer"></div>
    <a class="app-nav" href="/">Accueil</a>
  </header>

  <main class="workbench">
    <aside class="rail" id="rail"><div class="empty">chargement…</div></aside>

    <section class="plan">
      <div class="plan-bar" id="planBar"><span>—</span></div>
      <div class="plan-body" id="planBody"></div>
      <div class="plan-nav" id="planNav"></div>
    </section>

    <aside class="proposal" id="proposal"><div class="empty">chargement…</div></aside>
  </main>

  <script>
    let WORKS = [];
    let CURRENT = null;   // le devis affiché
    let LINES = [];       // ses articles
    let INDEX = 0;        // l'article en revue
    let FILES = [];       // les pièces jointes archivées de ce devis
    let DOC = null;       // le document ouvert { fileId, fileName, pdf, pages }
    let PAGE = 1;         // sa page affichée
    let PICKED = null;    // document choisi à la main — il prime sur le rattachement
    let RENDER = 0;       // jeton : un rendu dépassé ne doit pas écraser le suivant

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    /** Ce qui s'affiche dans le cadre : un PDF ou une image. Le reste se télécharge. */
    function isViewable(name) { return /\.(pdf|png|jpe?g)$/i.test(name); }
    function isPdf(name) { return /\.pdf$/i.test(name); }

    /** Pour comparer un nom de fichier à une référence sans buter sur la ponctuation. */
    function normalize(text) { return String(text || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }

    /**
     * Quel document montrer pour cet article, et à quel point on en est sûr.
     *
     * Un plan nommé d'après la référence de la pièce, c'est une certitude. Un
     * document unique sur une demande à un seul article, c'est raisonnable.
     * Tout le reste est une supposition, et l'écran doit le dire plutôt que de
     * laisser croire que le plan affiché est celui du prix affiché.
     */
    /**
     * Une image de signature n'est pas un plan.
     *
     * Un mail d'entreprise transporte son logo et ses séparateurs, qu'Outlook
     * nomme image001.png et que Gmail rend parfois comme pièces jointes. Les
     * ouvrir par défaut à la place du plan fait perdre un clic à chaque
     * article. Elles restent listées — rien n'est caché — mais ne sont pas le
     * premier choix.
     */
    function looksDecorative(file) {
      if (!/\.(png|jpe?g|gif)$/i.test(file.fileName)) return false;
      if (/^image\d{3}\.(png|gif|jpe?g)$/i.test(file.fileName)) return true;
      // Un plan photographié au téléphone pèse des centaines de kilo-octets ;
      // un bandeau de signature, quelques dizaines. Le nom ne dit rien —
      // sur DE5419, le logo de l'entreprise s'appelait IMG-20220307-WA0014.
      return (file.byteSize || 0) < 150000;
    }

    function documentFor(line) {
      const viewable = FILES.filter(f => isViewable(f.fileName));
      if (viewable.length === 0) return { file: null, certainty: 'aucun' };

      const ref = normalize(line && line.reference);
      if (ref.length >= 3) {
        const named = viewable.find(f => normalize(f.fileName).includes(ref));
        if (named) return { file: named, certainty: 'nomme' };
      }

      // Un PDF est presque toujours un vrai plan ; sinon la plus grosse image
      // non décorative, une photo de plan pesant bien plus qu'un logo.
      const serious = viewable.filter(f => !looksDecorative(f));

      // Quand il ne reste rien de sérieux, ne rien ouvrir. Afficher le logo de
      // l'expéditeur à la place d'un plan ferait croire qu'on a reçu quelque
      // chose. Les vignettes restent cliquables pour qui veut vérifier.
      if (serious.length === 0) return { file: null, certainty: 'decoratif' };

      if (serious.length === 1 && LINES.length === 1) {
        return { file: serious[0], certainty: 'unique' };
      }

      const pdfs = serious.filter(f => isPdf(f.fileName));
      const ranked = (pdfs.length ? pdfs : serious)
        .slice()
        .sort((a, b) => (b.byteSize || 0) - (a.byteSize || 0));
      return { file: ranked[0], certainty: 'suppose' };
    }

    const STATUS_LABEL = {
      a_traiter: 'à traiter',
      validee: 'validé',
      forcee: 'prix imposé',
      manuelle: 'traitement manuel',
      rejetee: 'rejeté',
    };

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;   // jamais innerHTML : ce texte vient des mails
      return node;
    }

    function money(value) {
      return value == null ? '—' : value.toFixed(2).replace('.', ',') + ' €';
    }

    // ── Colonne 1 : les devis ──────────────────────────────────
    function renderRail() {
      const rail = document.getElementById('rail');
      rail.innerHTML = '';

      if (!CURRENT) {
        rail.appendChild(el('div', 'empty', 'Aucun devis.'));
        return;
      }

      const head = el('div', 'rail-head');
      head.appendChild(el('span', 'rail-ref', CURRENT.ref));
      head.appendChild(el('span', 'rail-client', CURRENT.client));
      rail.appendChild(head);

      const pending = LINES.filter(l => l.status === 'a_traiter').length;
      const count = el('div', 'rail-count');
      count.appendChild(el('span', 'n', String(pending)));
      count.appendChild(el('span', 'label', pending > 1 ? 'articles à traiter' : 'article à traiter'));
      rail.appendChild(count);

      const list = el('div', 'devis-list');
      list.appendChild(el('div', 'eyebrow', 'Devis en cours'));
      for (const work of WORKS) {
        const btn = el('button', 'devis');
        btn.type = 'button';
        btn.setAttribute('aria-current', String(work.id === CURRENT.id));
        btn.appendChild(el('span', 'ref', work.ref));
        btn.appendChild(el('span', 'n', String(work.lineCount || 0)));
        btn.onclick = () => selectWork(work.id);
        list.appendChild(btn);
      }
      rail.appendChild(list);
    }

    // ── Colonne 2 : le plan ────────────────────────────────────
    function renderPlan() {
      const bar = document.getElementById('planBar');
      const body = document.getElementById('planBody');
      const nav = document.getElementById('planNav');
      bar.innerHTML = ''; body.innerHTML = ''; nav.innerHTML = '';

      const line = LINES[INDEX];
      if (!line) {
        body.appendChild(el('div', null, 'Aucun article à afficher pour ce devis.'));
        return;
      }

      bar.appendChild(el('span', null, CURRENT.ref));
      bar.appendChild(el('span', 'badge', 'Article ' + (INDEX + 1) + ' / ' + LINES.length));
      if (line.alertLevel && line.alertLevel !== 'vert') {
        bar.appendChild(el('span', 'badge', line.alertLevel === 'rouge' ? 'non chiffrable' : 'sous hypothèse'));
      }
      if (line.status && line.status !== 'a_traiter') {
        bar.appendChild(el('span', 'badge', STATUS_LABEL[line.status]));
      }

      const sheet = el('div', 'plan-sheet');
      sheet.appendChild(el('div', 'title', (line.reference || '—') + ' · ' + (line.designation || 'sans désignation')));

      // PICKED est un choix de l'opérateur : il prime sur le rattachement
      // automatique tant qu'il reste sur cet article.
      const match = documentFor(line);
      const target = PICKED || match.file;

      const frame = el('div', 'frame');
      if (!target) {
        frame.appendChild(el('span', null,
          match.certainty === 'decoratif'
            ? 'Aucun plan reçu : les images jointes sont des éléments de signature du mail, pas des documents techniques. Elles restent consultables ci-dessous.'
            : FILES.length > 0
            ? 'Aucun plan lisible parmi les pièces jointes — seuls des fichiers à télécharger ont été reçus.'
            : CURRENT.detailsInAttachments
              ? 'Cette demande annonce des pièces jointes, mais aucune n’est arrivée jusqu’ici. Elle est antérieure au pont qui les transmet.'
              : 'Aucun plan reçu avec cette demande. Le chiffrage s’appuie sur le texte du mail.'));
      } else {
        sheet.classList.add('has-plan');
        frame.appendChild(el('span', null, 'ouverture du plan…'));
        showDocument(target, frame);
      }
      sheet.appendChild(frame);

      const cartouche = el('div', 'cartouche');
      [['MATIÈRE', line.material || 'Non lisible'],
       ['QTÉ', line.quantity || '—'],
       ['ÉTAT', STATUS_LABEL[line.status] || '—']].forEach(([k, v]) => {
        const cell = el('div');
        cell.appendChild(el('div', 'dim', k));
        cell.appendChild(el('div', null, v));
        cartouche.appendChild(cell);
      });
      sheet.appendChild(cartouche);
      body.appendChild(sheet);

      body.appendChild(renderDocs(line, match, target));

      if (line.comment) body.appendChild(el('div', null, line.comment));

      const prev = el('button', 'btn btn-ghost', '← Précédent');
      prev.type = 'button';
      prev.disabled = INDEX === 0;
      prev.onclick = () => { INDEX--; PICKED = null; renderAll(); };

      const next = el('button', 'btn btn-ghost', 'Suivant →');
      next.type = 'button';
      next.disabled = INDEX >= LINES.length - 1;
      next.onclick = () => { INDEX++; PICKED = null; renderAll(); };

      nav.appendChild(prev);
      nav.appendChild(el('span', 'pos', (INDEX + 1) + ' / ' + LINES.length));
      nav.appendChild(next);
    }

    /** L'adresse d'un fichier archivé, servie par nous. */
    function fileUrl(file) {
      return '/api/works/' + encodeURIComponent(CURRENT.id) +
             '/files/' + encodeURIComponent(file.id) + '/content';
    }

    /**
     * Ouvre un document dans le cadre.
     *
     * Le jeton RENDER protège d'une course : un opérateur qui enchaîne les
     * articles plus vite que ne se charge un PDF ne doit pas voir le plan du
     * précédent s'installer sur celui qu'il regarde.
     */
    async function showDocument(file, frame) {
      const token = ++RENDER;

      if (!isPdf(file.fileName)) {
        const img = el('img');
        img.src = fileUrl(file);
        img.alt = 'Plan ' + file.fileName;
        img.onload = () => { if (token === RENDER) { frame.innerHTML = ''; frame.appendChild(img); } };
        img.onerror = () => {
          if (token !== RENDER) return;
          frame.innerHTML = '';
          frame.appendChild(el('span', null, 'Image illisible : ' + file.fileName));
        };
        return;
      }

      try {
        // Un même document n'est pas rechargé quand on passe d'un article à
        // l'autre : c'est souvent le même plan pour toute la demande.
        if (!DOC || DOC.fileId !== file.id) {
          const pdf = await pdfjsLib.getDocument({ url: fileUrl(file) }).promise;
          if (token !== RENDER) return;
          DOC = { fileId: file.id, fileName: file.fileName, pdf, pages: pdf.numPages };
          PAGE = 1;
        }
        if (PAGE > DOC.pages) PAGE = 1;

        const page = await DOC.pdf.getPage(PAGE);
        if (token !== RENDER) return;

        // Rendu à la taille du cadre, en tenant compte de la densité d'écran :
        // une cote lue de travers ne sert à personne.
        const box = frame.getBoundingClientRect();
        const base = page.getViewport({ scale: 1 });
        const scale = Math.max(
          0.1,
          Math.min(box.width / base.width, box.height / base.height),
        );
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const viewport = page.getViewport({ scale: scale * dpr });

        const canvas = el('canvas');
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.style.width = Math.floor(viewport.width / dpr) + 'px';
        canvas.style.height = Math.floor(viewport.height / dpr) + 'px';

        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        if (token !== RENDER) return;

        frame.innerHTML = '';
        frame.appendChild(canvas);
        renderPlan.pageCount = DOC.pages;
        refreshDocs();
      } catch (err) {
        if (token !== RENDER) return;
        frame.innerHTML = '';
        frame.appendChild(el('span', null, 'Plan illisible : ' + err.message));
      }
    }

    /**
     * Les documents reçus, et ce que vaut le rattachement.
     *
     * Dire « plan supposé » coûte une ligne ; laisser croire qu'un plan est
     * celui de l'article chiffré coûte un devis faux.
     */
    function renderDocs(line, match, target) {
      const box = el('div', 'docs-wrap');
      box.style.display = 'flex';
      box.style.flexDirection = 'column';
      box.style.gap = '10px';
      box.style.alignItems = 'center';

      if (FILES.length === 0) return box;

      const chips = el('div', 'docs');
      for (const file of FILES) {
        if (isViewable(file.fileName)) {
          const chip = el('button', 'doc-chip', file.fileName);
          chip.type = 'button';
          chip.setAttribute('aria-current', String(!!target && file.id === target.id));
          chip.onclick = () => { PICKED = file; PAGE = 1; renderPlan(); };
          chips.appendChild(chip);
        } else {
          // Un tableur ou un STEP ne s'affiche pas : il se récupère.
          const link = el('a', 'doc-chip', file.fileName);
          link.href = fileUrl(file);
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.appendChild(el('span', 'n', '↓'));
          chips.appendChild(link);
        }
      }
      box.appendChild(chips);

      if (target && DOC && DOC.fileId === target.id && DOC.pages > 1) {
        const pager = el('div', 'docs');
        const prev = el('button', 'doc-chip', '← page');
        prev.type = 'button';
        prev.disabled = PAGE <= 1;
        prev.onclick = () => { PAGE--; renderPlan(); };
        const next = el('button', 'doc-chip', 'page →');
        next.type = 'button';
        next.disabled = PAGE >= DOC.pages;
        next.onclick = () => { PAGE++; renderPlan(); };
        pager.appendChild(prev);
        pager.appendChild(el('span', 'doc-note', 'page ' + PAGE + ' / ' + DOC.pages));
        pager.appendChild(next);
        box.appendChild(pager);
      }

      if (target) {
        const certainty = PICKED ? 'choisi' : match.certainty;
        const NOTE = {
          nomme: ['Ce plan porte la référence de l’article — rattachement certain.', false],
          unique: ['Seul document reçu, et un seul article dans la demande.', false],
          suppose: ['Rattachement supposé : aucun document ne porte la référence de cet article. Vérifiez avant de valider.', true],
          choisi: ['Document choisi à la main.', false],
        }[certainty];
        if (NOTE) {
          const note = el('div', 'doc-note' + (NOTE[1] ? ' uncertain' : ''), NOTE[0]);
          box.appendChild(note);
        }
      }

      return box;
    }

    /** Redessine la seule barre de documents, une fois le PDF ouvert et paginé. */
    function refreshDocs() {
      const body = document.getElementById('planBody');
      const old = body.querySelector('.docs-wrap');
      if (!old) return;
      const line = LINES[INDEX];
      const match = documentFor(line);
      old.replaceWith(renderDocs(line, match, PICKED || match.file));
    }

    // ── Colonne 3 : la proposition ─────────────────────────────
    function renderProposal() {
      const box = document.getElementById('proposal');
      box.innerHTML = '';

      const line = LINES[INDEX];
      if (!line) {
        box.appendChild(el('div', 'empty',
          CURRENT && CURRENT.detailsInAttachments
            ? 'Cette demande n’a aucune ligne lisible : son contenu est dans les pièces jointes.'
            : 'Aucun article.'));
        return;
      }

      const head = el('div', 'prop-head');
      head.appendChild(el('div', 'eyebrow', 'Proposition · prix de revient unitaire'));
      if (line.unitPrice != null) {
        head.appendChild(el('div', 'price-big', money(line.unitPrice)));
        head.appendChild(el('div', 'price-sub',
          line.status === 'forcee'
            ? 'prix imposé par le technicien'
            : 'calcul déterministe · ' + money(line.totalPrice) + ' pour la série'));
      } else {
        head.appendChild(el('div', 'price-none', 'Pas de prix'));
        head.appendChild(el('div', 'price-sub',
          line.status === 'manuelle'
            ? 'ligne sortie du chiffrage, à compléter à la main'
            : 'article non chiffrable en l’état'));
      }
      box.appendChild(head);

      const facts = el('div', 'facts');
      [['Désignation', line.designation || '—'],
       ['Matière', line.material || 'Non lisible'],
       ['Qté', line.quantity || '—']].forEach(([k, v]) => {
        const f = el('div', 'fact');
        f.appendChild(el('div', 'k', k));
        f.appendChild(el('div', 'v', v));
        facts.appendChild(f);
      });
      box.appendChild(facts);

      const detail = el('div', 'section');
      detail.appendChild(el('div', 'eyebrow', 'Détail du calcul'));
      const items = (line.priceBreakdown && line.priceBreakdown.items) || [];
      if (items.length === 0) {
        detail.appendChild(el('div', 'note', 'Aucun calcul : cette ligne n’a pas été chiffrée.'));
      }
      for (const item of items) {
        const row = el('div', 'detail-row');
        row.appendChild(el('span', 'label', item.label));
        row.appendChild(el('span', 'amount', money(item.amount)));
        detail.appendChild(row);
        detail.appendChild(el('div', 'detail-basis', item.basis));
      }
      box.appendChild(detail);

      const alerts = el('div', 'section');
      alerts.appendChild(el('div', 'eyebrow', 'Alertes'));
      const list = (line.alerts && line.alerts.length) ? line.alerts : [];
      if (list.length === 0) {
        const ok = el('div', 'alert alert-vert');
        ok.appendChild(el('span', 'dot'));
        ok.appendChild(el('span', null, 'Rien à signaler : la demande se suffit à elle-même.'));
        alerts.appendChild(ok);
      }
      for (const text of list) {
        const a = el('div', 'alert alert-' + (line.alertLevel || 'jaune'));
        a.appendChild(el('span', 'dot'));
        a.appendChild(el('span', null, text));
        alerts.appendChild(a);
      }
      box.appendChild(alerts);

      box.appendChild(renderChoices(line));

      const verdict = el('div', 'verdict');
      const reject = el('button', 'btn btn-danger', '✕ Rejeter');
      reject.type = 'button';
      reject.onclick = () => review(line, 'rejeter');
      const validate = el('button', 'btn btn-primary', '✓ Valider');
      validate.type = 'button';
      validate.onclick = () => review(line, 'valider');
      verdict.appendChild(reject);
      verdict.appendChild(validate);
      box.appendChild(verdict);

      if (line.reviewNote) {
        const n = el('div', 'section');
        n.appendChild(el('div', 'eyebrow', 'Consigne du technicien'));
        n.appendChild(el('div', 'note', line.reviewNote));
        box.appendChild(n);
      }
    }

    /** Les trois issues autres que « valider » : imposer, recalculer, sortir. */
    function renderChoices(line) {
      const box = el('div', 'section');

      const force = el('button', 'choice');
      force.type = 'button';
      force.setAttribute('aria-expanded', 'false');
      force.appendChild(el('span', 't', 'Forcer le prix'));
      force.appendChild(el('span', 'd', 'prix imposé, sans recalcul — le calcul reste au bordereau'));
      const forceBody = el('div', 'choice-body');
      forceBody.hidden = true;
      const priceInput = el('input');
      priceInput.type = 'number'; priceInput.step = '0.01'; priceInput.min = '0';
      priceInput.placeholder = 'prix unitaire imposé';
      priceInput.setAttribute('aria-label', 'Prix unitaire imposé');
      const forceBtn = el('button', 'btn btn-ghost', 'Imposer ce prix');
      forceBtn.type = 'button';
      forceBtn.onclick = () => review(line, 'forcer', { price: Number(priceInput.value) });
      forceBody.appendChild(priceInput);
      forceBody.appendChild(forceBtn);
      force.onclick = () => {
        const open = forceBody.hidden;
        forceBody.hidden = !open;
        force.setAttribute('aria-expanded', String(open));
      };
      box.appendChild(force);
      box.appendChild(forceBody);

      const recalc = el('button', 'choice');
      recalc.type = 'button';
      recalc.setAttribute('aria-expanded', 'false');
      recalc.appendChild(el('span', 't', 'Commentaire de recalcul'));
      recalc.appendChild(el('span', 'd', 'l’outil recalcule avec votre consigne'));
      const recalcBody = el('div', 'choice-body');
      recalcBody.hidden = true;
      const noteInput = el('textarea');
      noteInput.rows = 3;
      noteInput.placeholder = 'ex : reprendre en inox 316L, brut barre Ø60';
      noteInput.setAttribute('aria-label', 'Consigne de recalcul');
      const recalcBtn = el('button', 'btn btn-ghost', 'Envoyer la consigne');
      recalcBtn.type = 'button';
      recalcBtn.onclick = () => review(line, 'recalculer', { note: noteInput.value });
      recalcBody.appendChild(noteInput);
      recalcBody.appendChild(recalcBtn);
      recalc.onclick = () => {
        const open = recalcBody.hidden;
        recalcBody.hidden = !open;
        recalc.setAttribute('aria-expanded', String(open));
      };
      box.appendChild(recalc);
      box.appendChild(recalcBody);

      const manual = el('button', 'choice');
      manual.type = 'button';
      manual.appendChild(el('span', 't', 'Traitement manuel'));
      manual.appendChild(el('span', 'd', 'la ligne part sans prix, marquée à compléter'));
      manual.onclick = () => review(line, 'manuel');
      box.appendChild(manual);

      return box;
    }

    // ── La décision ────────────────────────────────────────────
    async function review(line, action, options = {}) {
      try {
        const resp = await fetch('/api/lines/' + encodeURIComponent(line.id) + '/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, ...options }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.message || 'HTTP ' + resp.status);

        LINES[INDEX] = { ...LINES[INDEX], ...data.line };
        // La revue s'enchaîne : on passe à l'article suivant, sauf si on vient
        // de demander un recalcul — là on reste pour en voir le résultat.
        if (action !== 'recalculer' && INDEX < LINES.length - 1) INDEX++;
        renderAll();
      } catch (err) {
        const box = document.getElementById('proposal');
        const warn = el('div', 'section');
        warn.appendChild(el('div', 'note warn', 'Décision non enregistrée : ' + err.message));
        box.prepend(warn);
      }
    }

    function renderAll() {
      renderRail();
      renderPlan();
      renderProposal();
    }

    async function selectWork(id) {
      CURRENT = WORKS.find(w => w.id === id) || null;
      INDEX = 0;
      LINES = [];
      FILES = [];
      DOC = null;
      PICKED = null;
      PAGE = 1;
      RENDER++;   // les plans du devis précédent ne doivent plus s'afficher
      renderAll();
      if (!CURRENT) return;

      // Les articles et les pièces jointes en parallèle : l'écran n'a pas de
      // raison d'attendre deux allers-retours l'un après l'autre.
      const [lines, files] = await Promise.all([
        fetch('/api/works/' + encodeURIComponent(CURRENT.id) + '/lines')
          .then(r => r.json()).then(d => d.lines || []).catch(() => []),
        fetch('/api/works/' + encodeURIComponent(CURRENT.id) + '/files')
          .then(r => r.json()).then(d => d.files || []).catch(() => []),
      ]);
      LINES = lines;
      FILES = files;
      renderAll();
    }

    async function load() {
      const rail = document.getElementById('rail');
      const proposal = document.getElementById('proposal');
      try {
        const resp = await fetch('/api/works?tool=chiffrage&limit=100');
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.message || 'HTTP ' + resp.status);

        WORKS = data.works || [];
        if (WORKS.length === 0) {
          rail.innerHTML = '';
          rail.appendChild(el('div', 'empty', 'Aucune demande reçue.'));
          proposal.innerHTML = '';
          proposal.appendChild(el('div', 'empty',
            'Un mail envoyé à chiffrage@usi-pro.com apparaît ici dans la minute.'));
          return;
        }
        await selectWork(WORKS[0].id);
      } catch (err) {
        proposal.innerHTML = '';
        proposal.appendChild(el('div', 'empty', 'Demandes injoignables : ' + err.message));
      }
    }

    load();
  </script>
</body>
