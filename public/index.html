<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USI-PRO Internal</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #0f1a2e;
      --accent: #1abc9c;
      --accent-deep: #0f766e;
      --accent-soft: #e6f8f4;
      --navy-soft: #e8edf6;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --text: #1e293b;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #eef2f7;
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent-deep); }

    /* ── NAVBAR ── */
    .navbar {
      background: var(--dark);
      height: 64px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--accent);
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    }

    .navbar-logo img { height: 28px; display: block; }
    .navbar-divider { width: 1px; height: 28px; background: rgba(255,255,255,0.14); }
    .nav-title { font-size: 15px; font-weight: 600; color: #fff; line-height: 1; }
    .nav-subtitle {
      font-size: 10px; color: rgba(255,255,255,0.45); font-weight: 500;
      letter-spacing: 0.8px; text-transform: uppercase; line-height: 1;
    }
    .navbar-link {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .navbar-link:hover { color: #fff; background: rgba(255,255,255,0.07); }

    /* ── LAYOUT ── */
    .page { max-width: 1280px; margin: 0 auto; padding: 28px 32px 60px; }

    /* ── TOOL CARDS ── */
    .tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }

    .tool-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 1px 3px rgba(15,26,46,0.05), 0 8px 24px rgba(15,26,46,0.05);
    }

    .tool-card.chiffrage { border-top-color: var(--dark); }

    .tool-head { display: flex; align-items: center; gap: 13px; }

    .tool-icon {
      width: 42px; height: 42px; flex-shrink: 0;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent-deep);
      display: flex; align-items: center; justify-content: center;
    }
    .tool-card.chiffrage .tool-icon { background: var(--navy-soft); color: var(--dark); }

    .tool-name { font-size: 18px; font-weight: 700; }
    .tool-sub { font-size: 12px; color: var(--text-muted); }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      height: 44px; padding: 0 18px;
      border: none; border-radius: 8px;
      font-family: inherit; font-size: 13.5px; font-weight: 700;
      text-decoration: none; cursor: pointer;
    }
    .btn-teal { background: var(--accent); color: var(--dark); }
    .btn-navy { background: var(--dark); color: #fff; }
    .btn-ghost {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border-strong);
      font-weight: 600;
    }

    .tool-preview {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      justify-content: center;
    }

    .preview-line { display: flex; align-items: baseline; gap: 9px; font-size: 13px; }
    .preview-line .label {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: var(--text-dim);
      min-width: 74px;
    }
    .preview-empty { font-size: 13px; color: var(--text-muted); line-height: 1.55; }

    .tool-foot {
      display: flex; align-items: center; gap: 10px;
      padding-top: 12px; border-top: 1px solid #eef2f7;
      font-size: 12.5px; color: #475569;
    }

    .spacer { flex-grow: 1; }

    /* ── FILES ── */
    .files { margin-top: 26px; display: flex; flex-direction: column; gap: 14px; }

    .files-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .files-head h2 { font-size: 18px; font-weight: 700; }
    .files-count { font-size: 12px; color: var(--text-muted); }

    .chip-btn {
      height: 34px; padding: 0 13px;
      font-family: inherit; font-size: 12.5px; font-weight: 600;
      color: #475569; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    }
    .chip-btn[aria-pressed="true"] {
      color: var(--dark); border-color: var(--border-strong); font-weight: 700;
      background: #f1f5f9;
    }

    .files-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .work-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .work-top { display: flex; align-items: center; gap: 8px; }
    .work-ref { font-size: 14px; font-weight: 600; }
    .work-sub { font-size: 12px; color: var(--text-dim); }
    .work-summary { font-size: 12.5px; color: #475569; line-height: 1.5; }
    .tag-attachments { color: #92400e; background: #fef3c7; }
    .work-when { font-size: 11.5px; color: var(--text-dim); }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; border-top: 1px solid #f1f5f9; }

    .tag {
      font-size: 11px; font-weight: 600;
      border-radius: 6px; padding: 4px 8px;
    }
    .tag-tool-edition { color: var(--accent-deep); background: var(--accent-soft); }
    .tag-tool-chiffrage { color: var(--dark); background: var(--navy-soft); }
    .tag-client { color: #6b21a8; background: #f4e8ff; }
    .tag-project { color: #1d4ed8; background: #e8eefc; }
    .tag-fb-plus { color: var(--accent-deep); background: var(--accent-soft); }
    .tag-fb-minus { color: #b45309; background: #fef3c7; }
    .tag-status-a_valider { color: #92400e; background: #fef3c7; }
    .tag-status-livre { color: #166534; background: #dcfce7; }

    .work-files-btn {
      align-self: flex-start;
      font-family: inherit; font-size: 12.5px; font-weight: 600;
      color: var(--accent-deep); background: none; border: none;
      padding: 0; cursor: pointer; text-decoration: underline;
    }

    .work-files-list { display: flex; flex-direction: column; gap: 5px; }
    .work-files-list a { font-size: 12.5px; }

    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: 10px;
      padding: 32px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13.5px;
      line-height: 1.6;
    }

    .error-state {
      background: #fef6f5;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      padding: 16px 18px;
      color: #991b1b;
      font-size: 13px;
    }

    @media (max-width: 1080px) {
      .tools { grid-template-columns: 1fr; }
      .files-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      .page { padding: 20px 16px 40px; }
      .files-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-logo"><img src="/logo.png" alt="USI-PRO"></div>
    <div class="navbar-divider"></div>
    <div style="display:flex;flex-direction:column;gap:3px">
      <span class="nav-title">Internal</span>
      <span class="nav-subtitle">Atelier IA</span>
    </div>
    <div class="spacer"></div>
    <a class="navbar-link" href="/step-compare.html">Comparaison STEP</a>
    <a class="navbar-link" href="/guide.html">Guide</a>
  </nav>

  <main class="page">

    <section class="tools">

      <div class="tool-card">
        <div class="tool-head">
          <div class="tool-icon">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.5 6.5l2.5 2.5M15 15l2.5 2.5M17.5 6.5L15 9M9 15l-2.5 2.5"/></svg>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px">
            <span class="tool-name">Édition AI</span>
            <span class="tool-sub" id="editionLast">chargement…</span>
          </div>
          <div class="spacer"></div>
          <a class="btn btn-teal" href="/edition.html">Nouveau lot
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
        <div class="tool-preview" id="editionPreview">
          <span class="preview-empty">chargement…</span>
        </div>
        <div class="tool-foot">
          <span id="editionQueue">—</span>
          <div class="spacer"></div>
          <a href="/edition.html">Ouvrir l'outil →</a>
        </div>
      </div>

      <div class="tool-card chiffrage">
        <div class="tool-head">
          <div class="tool-icon">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 7.5h7M8.5 12h1.5M13 12h2.5M8.5 16h1.5M13 16h2.5"/></svg>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px">
            <span class="tool-name">Chiffrage AI</span>
            <span class="tool-sub" id="chiffrageLast">du mail au devis</span>
          </div>
          <div class="spacer"></div>
          <a class="btn btn-navy" href="mailto:chiffrage@usi-pro.com?subject=Demande%20de%20chiffrage">Envoyer une demande
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
        <div class="tool-preview" id="chiffragePreview">
          <span class="preview-empty">chargement…</span>
        </div>
        <div class="tool-foot">
          <span id="chiffrageQueue">—</span>
          <div class="spacer"></div>
          <a href="/guide.html">Comment ça marche →</a>
        </div>
      </div>

    </section>

    <section class="files">
      <div class="files-head">
        <h2>Fichiers</h2>
        <span class="files-count" id="filesCount">—</span>
        <div class="spacer"></div>
        <div id="filterChips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      </div>
      <div id="filesBody">
        <div class="empty-state">chargement…</div>
      </div>
    </section>

  </main>

  <script>
    // ── State ────────────────────────────────────────────────────
    let allWorks = [];
    let activeFilter = null; // { type: 'client' | 'project' | 'tool', value: string }

    const TOOL_LABEL = { edition: 'Édition AI', chiffrage: 'Chiffrage AI' };
    const STATUS_LABEL = { a_valider: 'À valider', livre: 'Livré' };

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;  // never innerHTML: rows carry typed data
      return node;
    }

    function relativeDate(iso) {
      const then = new Date(iso);
      if (Number.isNaN(then.getTime())) return '';
      const mins = Math.round((Date.now() - then.getTime()) / 60000);
      if (mins < 1) return "à l'instant";
      if (mins < 60) return 'il y a ' + mins + ' min';
      const hours = Math.round(mins / 60);
      if (hours < 24) return 'il y a ' + hours + ' h';
      return then.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
    }

    // ── Tool cards ───────────────────────────────────────────────

    function renderToolCard(tool, works) {
      const mine = works.filter(w => w.tool === tool);
      const last = mine[0] || null;
      const waiting = mine.filter(w => w.status === 'a_valider').length;

      const lastEl = document.getElementById(tool === 'edition' ? 'editionLast' : 'chiffrageLast');
      const previewEl = document.getElementById(tool === 'edition' ? 'editionPreview' : 'chiffragePreview');
      const queueEl = document.getElementById(tool === 'edition' ? 'editionQueue' : 'chiffrageQueue');

      previewEl.innerHTML = '';

      if (!last) {
        lastEl.textContent = tool === 'edition' ? 'aucun lot pour le moment' : 'du mail au devis';
        previewEl.appendChild(el('span', 'preview-empty',
          tool === 'edition'
            ? "Rien encore. Le premier lot lancé depuis Édition AI s'affichera ici, avec ses plans et son lien Dropbox."
            : "Les demandes arrivent par mail sur chiffrage@usi-pro.com. La phase 1 se lance seule ; la validation reste sur l'écran des plans."));
        queueEl.textContent = tool === 'edition' ? 'aucun lot en attente' : 'aucune demande traitée';
        return;
      }

      lastEl.textContent = 'dernier : ' + last.ref + ' · ' + relativeDate(last.updatedAt);

      const rows = [
        ['Travail', last.ref],
        ['Plans', String(last.planCount) + (last.planCount > 1 ? ' plans anonymisés' : ' plan anonymisé')],
        ['Statut', STATUS_LABEL[last.status] || last.status],
      ];
      if (last.missingParts && last.missingParts.length) {
        rows.push(['Manquant', last.missingParts.join(', ')]);
      }

      for (const [label, value] of rows) {
        const line = el('div', 'preview-line');
        line.appendChild(el('span', 'label', label));
        line.appendChild(el('span', null, value));
        previewEl.appendChild(line);
      }

      if (last.dropboxLink) {
        const line = el('div', 'preview-line');
        line.appendChild(el('span', 'label', 'Dropbox'));
        const a = el('a', null, 'ouvrir le dossier');
        a.href = last.dropboxLink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        line.appendChild(a);
        previewEl.appendChild(line);
      }

      queueEl.textContent = waiting > 0
        ? waiting + (waiting > 1 ? ' travaux en attente de validation' : ' travail en attente de validation')
        : 'tout est validé';
    }

    // ── Files ────────────────────────────────────────────────────

    function renderFilters(facets) {
      const box = document.getElementById('filterChips');
      box.innerHTML = '';

      const chips = [{ type: null, value: null, label: 'Tous' }];
      for (const [client, n] of Object.entries(facets.clients || {})) {
        chips.push({ type: 'client', value: client, label: 'Client · ' + client + ' (' + n + ')' });
      }
      for (const [project, n] of Object.entries(facets.projects || {})) {
        chips.push({ type: 'project', value: project, label: 'Projet · ' + project + ' (' + n + ')' });
      }

      for (const chip of chips) {
        const btn = el('button', 'chip-btn', chip.label);
        btn.type = 'button';
        const isActive = chip.type === null
          ? activeFilter === null
          : activeFilter && activeFilter.type === chip.type && activeFilter.value === chip.value;
        btn.setAttribute('aria-pressed', String(!!isActive));
        btn.onclick = () => {
          activeFilter = chip.type === null ? null : { type: chip.type, value: chip.value };
          renderFilters(facets);
          renderFiles();
        };
        box.appendChild(btn);
      }
    }

    function visibleWorks() {
      if (!activeFilter) return allWorks;
      return allWorks.filter(w =>
        activeFilter.type === 'client' ? w.client === activeFilter.value : w.project === activeFilter.value);
    }

    function renderFiles() {
      const body = document.getElementById('filesBody');
      const works = visibleWorks();
      body.innerHTML = '';

      document.getElementById('filesCount').textContent =
        allWorks.length + (allWorks.length > 1 ? ' travaux' : ' travail');

      if (works.length === 0) {
        body.appendChild(el('div', 'empty-state',
          allWorks.length === 0
            ? "Aucun travail indexé pour l'instant. Dès qu'un lot passe par Édition AI, il apparaît ici avec ses tags, ses retours et ses fichiers."
            : 'Aucun travail pour ce filtre.'));
        return;
      }

      const grid = el('div', 'files-grid');

      for (const work of works) {
        const card = el('div', 'work-card');

        const top = el('div', 'work-top');
        top.appendChild(el('span', 'tag tag-tool-' + work.tool, TOOL_LABEL[work.tool] || work.tool));
        top.appendChild(el('div', 'spacer'));
        top.appendChild(el('span', 'work-when', relativeDate(work.updatedAt)));
        card.appendChild(top);

        card.appendChild(el('span', 'work-ref', work.ref));

        if (work.tool === 'chiffrage') {
          const lineCount = work.lineCount || 0;
          card.appendChild(el('span', 'work-sub',
            lineCount > 0
              ? lineCount + (lineCount > 1 ? ' pièces demandées' : ' pièce demandée')
              : 'contenu à lire'));
          if (work.summary) card.appendChild(el('span', 'work-summary', work.summary));
        } else {
          const parts = work.partIds && work.partIds.length ? work.partIds.join(', ') : 'aucune pièce';
          card.appendChild(el('span', 'work-sub',
            work.planCount + (work.planCount > 1 ? ' plans' : ' plan') + ' · ' + parts));
        }

        const tags = el('div', 'tags');
        tags.appendChild(el('span', 'tag tag-status-' + work.status, STATUS_LABEL[work.status] || work.status));
        tags.appendChild(el('span', 'tag tag-client', 'Client · ' + work.client));
        if (work.project) tags.appendChild(el('span', 'tag tag-project', 'Projet · ' + work.project));
        if (work.feedback && work.feedback.plus) {
          tags.appendChild(el('span', 'tag tag-fb-plus', 'Feedback + ' + work.feedback.plus));
        }
        if (work.feedback && work.feedback.minus) {
          tags.appendChild(el('span', 'tag tag-fb-minus', 'Feedback − ' + work.feedback.minus));
        }
        if (work.detailsInAttachments) {
          tags.appendChild(el('span', 'tag tag-attachments', 'Détails en pièce jointe'));
        }
        card.appendChild(tags);

        if (work.fileCount > 0) {
          const btn = el('button', 'work-files-btn',
            work.fileCount + (work.fileCount > 1 ? ' fichiers archivés' : ' fichier archivé'));
          btn.type = 'button';
          const list = el('div', 'work-files-list');
          list.hidden = true;
          btn.onclick = async () => {
            if (!list.hidden) { list.hidden = true; return; }
            list.hidden = false;
            if (list.childElementCount === 0) {
              list.appendChild(el('span', 'work-sub', 'chargement…'));
              try {
                const resp = await fetch('/api/works/' + encodeURIComponent(work.id) + '/files');
                const data = await resp.json();
                list.innerHTML = '';
                for (const file of data.files || []) {
                  if (!file.url) { list.appendChild(el('span', 'work-sub', file.fileName)); continue; }
                  const a = el('a', null, file.fileName);
                  a.href = file.url;
                  a.target = '_blank';
                  a.rel = 'noopener noreferrer';
                  list.appendChild(a);
                }
              } catch (err) {
                list.innerHTML = '';
                list.appendChild(el('span', 'work-sub', 'Fichiers illisibles : ' + err.message));
              }
            }
          };
          card.appendChild(btn);
          card.appendChild(list);
        } else if (work.dropboxLink) {
          const a = el('a', 'work-files-btn', 'Ouvrir sur Dropbox');
          a.href = work.dropboxLink;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          card.appendChild(a);
        }

        grid.appendChild(card);
      }

      body.appendChild(grid);
    }

    // ── Load ─────────────────────────────────────────────────────

    async function load() {
      try {
        const resp = await fetch('/api/works?limit=60');
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.message || 'HTTP ' + resp.status);

        allWorks = data.works || [];
        renderToolCard('edition', allWorks);
        renderToolCard('chiffrage', allWorks);
        renderFilters(data.facets || { clients: {}, projects: {} });
        renderFiles();
      } catch (err) {
        document.getElementById('editionLast').textContent = 'index indisponible';
        document.getElementById('chiffrageLast').textContent = 'index indisponible';
        const body = document.getElementById('filesBody');
        body.innerHTML = '';
        body.appendChild(el('div', 'error-state',
          "L'index des travaux est injoignable : " + err.message));
      }
    }

    load();
  </script>
</body>
</html>
